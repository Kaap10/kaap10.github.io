        id: 't1', label: 'Closures', html: `
            <div class="section">
                <h2>What is a Closure?</h2>
                <p>A closure is a function that remembers its outer variables and can access them even after the outer function has finished executing. It "closes over" its lexical environment.</p>
                <div class="hl">In JS, closures are created every time a function is created, at function creation time.</div>
            </div>
            <div class="section">
                <h2>How it works (Data Privacy)</h2>
                <p>Closures are commonly used to emulate private methods/variables in JavaScript (since traditional JS didn't have <code>private</code> keywords).</p>
                <div class="cb">function createCounter() {
    let count = 0; // Private variable

    return {
        increment: function() {
            count++;
            console.log("Count is:", count);
        },
        decrement: function() {
            count--;
            console.log("Count is:", count);
        },
        getCount: function() {
            return count;
        }
    };
}

const counter1 = createCounter();
counter1.increment(); 
counter1.increment(); 
console.log("Final count:", counter1.getCount());

// count cannot be accessed directly!
console.log("Direct access:", counter1.count);</div>
                <div class="ol">Console Output</div>
                <div class="ob">Count is: 1
Count is: 2
Final count: 2
Direct access: undefined</div>
            </div>
            <div class="section">
                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the classic <code>for</code> loop closure bug with <code>var</code>? <span class="arr">▾</span></div><div class="qa-a">If you run a <code>for</code> loop using <code>var i</code> and put a <code>setTimeout</code> inside it, by the time the timeout runs, the loop has finished and <code>i</code> equals the final value for all timeouts. This happens because <code>var</code> is function-scoped (or global). The fix is to use <code>let i</code>, which is block-scoped, creating a new binding (new closure environment) for each iteration.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. What is a memory leak in the context of closures? <span class="arr">▾</span></div><div class="qa-a">Closures prevent the garbage collector from freeing the memory of outer variables because the inner function still holds a reference to them. If you create large objects in an outer function and return a closure that keeps referencing them, that memory is locked until the closure itself is destroyed.</div></div>
            </div>
        `

    {
        id: 't2', label: 'this keyword', html: `
            <div class="section">
                <h2>The Golden Rule of <code>this</code></h2>
                <p>Unlike other languages where <code>this</code> depends on where the function is written, in JavaScript (for regular functions), <code>this</code> depends entirely on <strong>HOW the function is called</strong>.</p>
                
            </div>
            <div class="section">
                <h2>The 5 Contexts of <code>this</code></h2>
                <div class="card-row">
                    <div class="card"><div class="lbl">Global Context</div><div class="val"><code>window</code> / <code>global</code></div><div class="sub">In browser, <code>this</code> alone points to Window object.</div></div>
                    <div class="card"><div class="lbl">Object Method</div><div class="val">The Object</div><div class="sub"><code>user.getName()</code> - <code>this</code> is <code>user</code>.</div></div>
                    <div class="card"><div class="lbl">Standalone Function</div><div class="val"><code>undefined</code> or <code>window</code></div><div class="sub">Undefined in strict mode, Window in loose mode.</div></div>
                    <div class="card"><div class="lbl">Constructor (new)</div><div class="val">The new instance</div><div class="sub">Points to the newly created object.</div></div>
                </div>
            </div>
            <div class="section">
                <h2>call, apply, and bind</h2>
                <p>You can explicitly force <code>this</code> to be whatever you want using these three methods.</p>
                <div class="cb">const user1 = { name: "Rahul" };
const user2 = { name: "Priya" };

function greet(greeting, punctuation) {
    console.log(greeting + ", " + this.name + punctuation);
}

// 1. call() - Pass arguments comma-separated
greet.call(user1, "Hello", "!");

// 2. apply() - Pass arguments as an array
greet.apply(user2, ["Welcome", "."]);

// 3. bind() - Returns a NEW function with 'this' locked permanently
const greetRahul = greet.bind(user1, "Hey");
greetRahul("?"); // we pass the remaining argument (punctuation)</div>
                <div class="ol">Console Output</div>
                <div class="ob">Hello, Rahul!
Welcome, Priya.
Hey, Rahul?</div>
            </div>
            <div class="section">
                <h2>Interview Q&A</h2>

            <div class="section">
                <h2>Prototypal Inheritance</h2>
                <p>JavaScript does not have traditional "classes" under the hood. Objects inherit directly from other objects via a hidden link called the Prototype Chain.</p>
                
            </div>
            <div class="section">
                <h2>How `prototype` and `__proto__` work</h2>
                <p>When you try to read a property (<code>obj.name</code>), JS first looks on the object itself. If it doesn't find it, it looks at the object's prototype (<code>obj.__proto__</code>), and so on up the chain until it hits <code>null</code>.</p>
                <div class="cb">function Animal(name) {
    this.name = name;
}

// Attach a method to the prototype, NOT the instance!
// Now all instances share this exact same function in memory.
Animal.prototype.speak = function() {
    console.log(this.name + " makes a noise.");
};

const dog = new Animal("Rex");
const cat = new Animal("Whiskers");

dog.speak();
cat.speak();

// Verification
console.log(dog.__proto__ === Animal.prototype); // true
console.log(dog.hasOwnProperty('name'));         // true (on instance)
console.log(dog.hasOwnProperty('speak'));        // false (on prototype)</div>
                <div class="ol">Console Output</div>
                <div class="ob">Rex makes a noise.
Whiskers makes a noise.
true
true
false</div>
            </div>
            <div class="section">
                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the end of the prototype chain? <span class="arr">▾</span></div><div class="qa-a">The chain ends at <code>Object.prototype.__proto__</code>, which is exactly equal to <code>null</code>. If JS searches up the entire chain and hits <code>null</code>, it returns <code>undefined</code> for that property.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. Why is adding methods to the `prototype` better than adding them inside the constructor? <span class="arr">▾</span></div><div class="qa-a">If you add a method inside the constructor via <code>this.speak = function(){}</code>, every single instance you create will hold a brand new copy of that function in memory. If you put it on the prototype, all instances share the same single memory reference of that function. It is vastly more memory-efficient.</div></div>
            </div>
        `

    {
        id: 't4', label: 'Async JS (Promises)', html`;
            <div class="section">
                <h2>The Evolution of Async JS</h2>
                <p>JavaScript is single-threaded. To avoid blocking the UI during long tasks (like network requests), it relies on asynchronous programming.</p>
                <div class="card-row">
                    <div class="card"><div class="lbl">Phase 1: Callbacks</div><div class="val">Callback Hell</div><div class="sub">Nesting functions inside functions created the "Pyramid of Doom".</div></div>
                    <div class="card"><div class="lbl">Phase 2: Promises (ES6)</div><div class="val">.then() / .catch()</div><div class="sub">A Promise represents the eventual completion or failure of an async operation.</div></div>
                    <div class="card"><div class="lbl">Phase 3: Async/Await (ES8)</div><div class="val">Syntactic Sugar</div><div class="sub">Makes asynchronous code look and behave like synchronous code.</div></div>
                </div>
            </div>
            <div class="section">
                <h2>Promises & Async/Await Code</h2>
                <div class="cb">const fetchUserData = () =&gt; {
    return new Promise((resolve, reject) =&gt; {
        setTimeout(() =&gt; {
            const success = true; // toggle to simulate failure
            if (success) resolve({ id: 1, name: "Rahul" });
            else reject("Network error: Server down");
        }, 1000);
    });
};

// 1. Using .then() and .catch()
fetchUserData()
    .then(data =&gt; console.log("Promise resolved:", data.name))
    .catch(err =&gt; console.log("Promise rejected:", err));

// 2. Using modern Async/Await (Much cleaner!)
async function getUser() {
    try {
        console.log("Fetching...");
        const data = await fetchUserData(); // Execution pauses here
        console.log("Async/Await resolved:", data.name);
    } catch (err) {
        console.log("Async/Await caught error:", err);
    }
}
getUser();</div>
                <div class="ol">Console Output</div>

(after 1 second)
Promise resolved: Rahul
Async/Await resolved: Rahul</div>

            <div class="section">
                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. Difference between Promise.all() and Promise.allSettled()? <span class="arr">▾</span></div><div class="qa-a"><code>Promise.all()</code> takes an array of promises and resolves only when ALL of them resolve. If even ONE rejects, the entire <code>Promise.all()</code> immediately rejects (fail-fast). <code>Promise.allSettled()</code> waits for all promises to finish regardless of whether they resolve or reject, returning an array of objects detailing the status (fulfilled/rejected) of each.</div></div>
            </div>
        `

        id: 't5', label: 'Event Loop & Task Queues', html: `
            <div class="section">
                <h2>How Single-Threaded JS handles concurrency</h2>
                <p>The <strong>Event Loop</strong> is the secret behind JavaScript's non-blocking nature. It constantly checks if the Call Stack is empty, and if so, pushes waiting callbacks from the queues into the stack.</p>
                
            </div>
            <div class="section">
                <h2>Microtasks vs Macrotasks</h2>
                <p>Not all async callbacks are treated equally. The Event Loop prioritizes the Microtask Queue over the Macrotask (Callback) Queue.</p>
                <ul style="margin-left: 20px; font-size: 14.5px; color: var(--color-text-secondary); line-height: 1.6;">
                    <li><strong>Microtasks (High Priority):</strong> Promises (<code>.then</code>, <code>.catch</code>), <code>MutationObserver</code>, <code>queueMicrotask</code>.</li>
                    <li><strong>Macrotasks (Low Priority):</strong> <code>setTimeout</code>, <code>setInterval</code>, DOM events, UI rendering.</li>
                </ul>
            </div>
            <div class="section">
                <h2>The Classic Interview Question</h2>
                <p>Can you guess the output order?</p>
                <div class="cb">console.log("1. Script Start");

setTimeout(() =&gt; {
    console.log("2. Macrotask (setTimeout)");
}, 0);

Promise.resolve().then(() =&gt; {
    console.log("3. Microtask (Promise)");
});

console.log("4. Script End");</div>

                <div class="ob">1. Script Start
4. Script End
3. Microtask (Promise)
2. Macrotask (setTimeout)</div>
                <div class="info"><strong>Why?</strong> Synchronous code runs first. Then the Event Loop checks the Microtask Queue (Promise). After the Microtask Queue is completely empty, it finally runs the Macrotask (setTimeout).</div>
            </div>
            <div class="section">
                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. Can a Microtask starve the Macrotask queue? <span class="arr">▾</span></div><div class="qa-a">Yes! The Event Loop will not move to the Macrotask queue (or render the UI) until the Microtask queue is entirely empty. If you recursively queue Microtasks (e.g., a Promise that resolves and queues another Promise endlessly), the browser will freeze and never execute <code>setTimeout</code> or render UI updates.</div></div>
            </div>
        `

            <div class="section">
                <h2>Optional Chaining & Nullish Coalescing</h2>
                <p>These operators (added in ES11/2020) dramatically clean up code that deals with API responses or deeply nested objects that might be missing data.</p>
                <div class="cb">const user = {

                <h2>Interview Q&A</h2>

            <div class="section">
                <h2>What is a Higher-Order Function (HOF)?</h2>

            <div class="section">
                <h2>Currying</h2>

                <div class="cb">// Normal Function

                <h2>try...catch...finally</h2>

const nav = document.getElementById('nav');
const pages = document.getElementById('pages');

topics.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.className = i === 0 ? 'active' : '';
    
    btn.onclick = () => {
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(t.id).classList.add('active');
    };
    
    nav.appendChild(btn);

    const page = document.createElement('div');
    page.className = 'page' + (i === 0 ? ' active' : '');
    page.id = t.id;
    page.innerHTML = t.html;
    pages.appendChild(page);
});

function tog(el) {
    const ans = el.nextElementSibling;
    const arr = el.querySelector('.arr');
    const isOpen = ans.classList.contains('open');

    // Close any currently open QAs within this specific page tab
    const currentPage = el.closest('.page');
    currentPage.querySelectorAll('.qa-a.open').forEach(openA => {
        openA.classList.remove('open');
        openA.previousElementSibling.querySelector('.arr').classList.remove('open');
    });

    if(!isOpen) {
        ans.classList.add('open');
        arr.classList.add('open');
    }
}
