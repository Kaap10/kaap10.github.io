<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Concepts Interactive Guide</title>
    <style>
        :root {
            --color-text-primary: #1a1a1a;
            --color-text-secondary: #4a4a4a;
            --color-text-tertiary: #757575;
            --color-background-primary: #ffffff;
            --color-background-secondary: #f4f5f7;
            --color-background-tertiary: #e9ecef;
            --color-border-secondary: #d1d5db;
            --color-border-tertiary: #e5e7eb;
            --border-radius-md: 8px;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 16px 0 12px;
        }

        .nav button {
            font-size: 12px;
            padding: 5px 11px;
            border-radius: 20px;
            border: 0.5px solid var(--color-border-secondary);
            background: transparent;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .nav button.active {
            background: #EAF3DE;
            color: #27500A;
            border-color: #97C459;
            font-weight: 500;
        }

        .page {
            display: none;
            padding-bottom: 24px;
        }

        .page.active {
            display: block;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 0.5px solid var(--color-border-tertiary);
        }

        .section p {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.7;
            margin-bottom: 8px;
        }

        .section p strong {
            color: var(--color-text-primary);
            font-weight: 500;
        }

        .card-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }

        .card {
            background: var(--color-background-secondary);
            border-radius: var(--border-radius-md);
            padding: 12px 14px;
        }

        .card .label {
            font-size: 11px;
            color: var(--color-text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .card .val {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-primary);
            line-height: 1.4;
        }

        .card .sub {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-top: 3px;
            line-height: 1.5;
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 10px;
            margin: 2px 2px 2px 0;
        }

        .tag.blue { background: #E6F1FB; color: #0C447C; }
        .tag.green { background: #EAF3DE; color: #27500A; }
        .tag.amber { background: #FAEEDA; color: #633806; }
        .tag.red { background: #FCEBEB; color: #791F1F; }
        .tag.purple { background: #EEEDFE; color: #3C3489; }
        .tag.teal { background: #E1F5EE; color: #085041; }
        .tag.coral { background: #FAECE7; color: #712B13; }

        code {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--color-background-secondary);
            padding: 1px 5px;
            border-radius: 4px;
            color: var(--color-text-primary);
        }

        .code-block {
            background: var(--color-background-secondary);
            border: 0.5px solid var(--color-border-tertiary);
            border-radius: var(--border-radius-md);
            padding: 12px 14px;
            margin: 8px 0;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-primary);
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .table-wrap {
            overflow-x: auto;
            margin: 8px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: var(--color-background-secondary);
            color: var(--color-text-secondary);
            font-weight: 500;
            text-align: left;
            padding: 8px 10px;
            border-bottom: 0.5px solid var(--color-border-secondary);
        }

        td {
            padding: 7px 10px;
            border-bottom: 0.5px solid var(--color-border-tertiary);
            color: var(--color-text-primary);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .qa {
            border: 0.5px solid var(--color-border-tertiary);
            border-radius: var(--border-radius-md);
            margin: 8px 0;
            overflow: hidden;
        }

        .qa-q {
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-background-secondary);
        }

        .qa-q:hover {
            background: var(--color-background-tertiary);
        }

        .qa-a {
            display: none;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--color-text-secondary);
            line-height: 1.7;
            border-top: 0.5px solid var(--color-border-tertiary);
            background: var(--color-background-primary);
        }

        .qa-a.open {
            display: block;
        }

        .arrow {
            font-size: 11px;
            transition: transform 0.2s;
            color: var(--color-text-tertiary);
            flex-shrink: 0;
            margin-left: 8px;
        }

        .arrow.open {
            transform: rotate(180deg);
        }

        .highlight, .remember, .danger {
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.7;
            margin: 8px 0;
        }

        .highlight {
            background: #FAEEDA;
            border-left: 3px solid #EF9F27;
            color: #412402;
        }

        .remember {
            background: #EAF3DE;
            border-left: 3px solid #639922;
            color: #173404;
        }

        .danger {
            background: #FCEBEB;
            border-left: 3px solid #E24B4A;
            color: #501313;
        }

        .step {
            border: 0.5px solid var(--color-border-tertiary);
            border-radius: var(--border-radius-md);
            margin: 8px 0;
            overflow: hidden;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--color-background-secondary);
        }

        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #EAF3DE;
            color: #27500A;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .step-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-primary);
        }

        .step-body {
            padding: 10px 14px;
            font-size: 13px;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        .nf-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .bad-row { background: #FCEBEB; }
        .good-row { background: #EAF3DE; }
    </style>
</head>
<body>

    <div class="nav" id="nav"></div>
    <div id="pages"></div>

    <script>
        const topics = [
            {
                id: 't1',
                label: 'Normalization (1NF→BCNF)',
                html: `
                    <div class="section">
                        <h2>Why normalize?</h2>
                        <p>Normalization removes <strong>data redundancy</strong> and <strong>update anomalies</strong> from tables by organizing them into well-structured smaller tables.</p>
                        <div class="danger">
                            <strong>Anomalies without normalization:</strong><br>
                            Insert anomaly — can't add data without unrelated data<br>
                            Update anomaly — changing one fact requires updating many rows<br>
                            Delete anomaly — deleting a row accidentally loses other useful data
                        </div>
                    </div>
                    <div class="section">
                        <h2>The problem table (unnormalized)</h2>
                        <div class="table-wrap">
                            <table>
                                <tr><th>RollNo</th><th>Name</th><th>CourseName</th><th>TeacherName</th><th>TeacherPhone</th></tr>
                                <tr class="bad-row"><td>101</td><td>Rahul</td><td>DBMS</td><td>Dr. Sharma</td><td>9876</td></tr>
                                <tr class="bad-row"><td>101</td><td>Rahul</td><td>OS</td><td>Dr. Gupta</td><td>5432</td></tr>
                                <tr class="bad-row"><td>102</td><td>Priya</td><td>DBMS</td><td>Dr. Sharma</td><td>9876</td></tr>
                            </table>
                        </div>
                        <p>Dr. Sharma's phone is stored 2 times. Change it once, must update all rows — that's an update anomaly.</p>
                    </div>
                    <div class="section">
                        <h2>1NF — First Normal Form</h2>
                        <div class="nf-badge" style="background:#E6F1FB;color:#0C447C">Rule: Every cell must have a single atomic value. No repeating groups.</div>
                        <div class="card-row">
                            <div class="card"><div class="label">Violates 1NF</div><div class="val">Phone: 9876, 5432</div><div class="sub">Two values in one cell — not atomic</div></div>
                            <div class="card"><div class="label">Satisfies 1NF</div><div class="val">One row per phone</div><div class="sub">Each cell has exactly one value</div></div>
                        </div>
                        <div class="remember">After 1NF: No multi-valued cells. No nested tables. All rows are unique (primary key exists).</div>
                    </div>
                    <div class="section">
                        <h2>2NF — Second Normal Form</h2>
                        <div class="nf-badge" style="background:#EAF3DE;color:#27500A">Rule: Must be in 1NF + No partial dependency (every non-key column must depend on the FULL primary key).</div>
                        <p>Partial dependency only matters when the primary key is composite (2+ columns).</p>
                        <div class="table-wrap">
                            <table>
                                <tr><th>RollNo (PK)</th><th>CourseName (PK)</th><th>TeacherName</th><th>StudentName</th></tr>
                                <tr><td>101</td><td>DBMS</td><td>Dr. Sharma</td><td>Rahul</td></tr>
                            </table>
                        </div>
                        <p><strong>StudentName</strong> depends only on RollNo (not the full PK). That's a partial dependency — violates 2NF.</p>
                        <div class="remember">Fix: Split into two tables — Student(RollNo, StudentName) and Enrollment(RollNo, CourseName, TeacherName).</div>
                    </div>
                    <div class="section">
                        <h2>3NF — Third Normal Form</h2>
                        <div class="nf-badge" style="background:#EEEDFE;color:#3C3489">Rule: Must be in 2NF + No transitive dependency (non-key column must NOT depend on another non-key column).</div>
                        <div class="table-wrap">
                            <table>
                                <tr><th>RollNo (PK)</th><th>Dept</th><th>HOD</th></tr>
                                <tr><td>101</td><td>CS</td><td>Dr. Verma</td></tr>
                                <tr><td>102</td><td>CS</td><td>Dr. Verma</td></tr>
                            </table>
                        </div>
                        <p>HOD depends on Dept, and Dept depends on RollNo. So HOD transitively depends on RollNo via Dept — violates 3NF.</p>
                        <div class="remember">Fix: Student(RollNo, Dept) and Department(Dept, HOD) — HOD now lives with Dept, not Student.</div>
                    </div>
                    <div class="section">
                        <h2>BCNF — Boyce-Codd Normal Form</h2>
                        <div class="nf-badge" style="background:#FAEEDA;color:#633806">Rule: Must be in 3NF + For every functional dependency X→Y, X must be a superkey.</div>
                        <p>BCNF is stricter than 3NF. A table can be in 3NF but violate BCNF when there are multiple overlapping candidate keys.</p>
                        <div class="highlight"><strong>Classic BCNF violation:</strong> Student-Teacher-Subject where a student takes a subject from one teacher, but a subject can be taught by multiple teachers. The FD Teacher→Subject exists, but Teacher is not a superkey — violates BCNF.</div>
                    </div>
                    <div class="section">
                        <h2>Quick memory trick</h2>
                        <div class="remember">
                            <strong>1NF:</strong> Atomic values only<br>
                            <strong>2NF:</strong> No partial dependency (part of PK → non-key is bad)<br>
                            <strong>3NF:</strong> No transitive dependency (non-key → non-key is bad)<br>
                            <strong>BCNF:</strong> Left side of every FD must be a superkey
                        </div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What are update, insert, and delete anomalies? <span class="arrow">▾</span></div>
                            <div class="qa-a">These are problems in poorly designed tables. <strong>Update anomaly:</strong> A fact is stored in multiple rows — updating one and missing others causes inconsistency (e.g., teacher's phone in 50 rows). <strong>Insert anomaly:</strong> You can't insert data without providing unrelated data (e.g., can't add a course without a student enrolled). <strong>Delete anomaly:</strong> Deleting a row accidentally removes unrelated useful data (e.g., deleting the last student in a course also loses the course information).</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. What is the difference between 3NF and BCNF? <span class="arrow">▾</span></div>
                            <div class="qa-a">3NF allows a non-superkey to determine a prime attribute (part of candidate key) — this is the only exception it permits. BCNF allows no such exception — for every FD X→Y, X must be a superkey, period. Every BCNF table is in 3NF, but not every 3NF table is in BCNF. BCNF is stronger. In practice, 3NF is preferred when decomposing to BCNF would lose the ability to check dependencies.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q3. Is normalization always good? Any disadvantages? <span class="arrow">▾</span></div>
                            <div class="qa-a">Normalization reduces redundancy and anomalies, but has trade-offs. Disadvantages: (1) More tables → more JOINs → slower query performance. (2) Complex queries become harder to write. (3) Too many JOINs can be a bottleneck at scale. For this reason, data warehouses and analytics systems deliberately denormalize (combine tables) to speed up read queries, accepting some redundancy for performance.</div>
                        </div>
                    </div>
                `
            },
            {
                id: 't2',
                label: 'Functional Dependencies',
                html: `
                    <div class="section">
                        <h2>What is a functional dependency?</h2>
                        <p>Attribute B is functionally dependent on attribute A (written <strong>A → B</strong>) if for every value of A, there is exactly one value of B.</p>
                        <div class="highlight">Example: RollNo → Name. For every roll number, there is exactly one student name. Knowing RollNo determines Name. But Name → RollNo is NOT true — two students can have the same name.</div>
                    </div>
                    <div class="section">
                        <h2>Types of functional dependencies</h2>
                        <div class="table-wrap">
                            <table>
                                <tr><th>Type</th><th>Meaning</th><th>Example</th></tr>
                                <tr><td><span class="tag blue">Full FD</span></td><td>Y depends on the entire composite key X</td><td>{RollNo, CourseName} → Grade</td></tr>
                                <tr><td><span class="tag red">Partial FD</span></td><td>Y depends on part of composite key X</td><td>RollNo → StudentName (violates 2NF)</td></tr>
                                <tr><td><span class="tag amber">Transitive FD</span></td><td>X→Z via X→Y→Z (Y is non-key)</td><td>RollNo→Dept→HOD (violates 3NF)</td></tr>
                                <tr><td><span class="tag green">Trivial FD</span></td><td>Y is a subset of X</td><td>{A,B} → A (always true, trivial)</td></tr>
                                <tr><td><span class="tag purple">Non-trivial FD</span></td><td>Y is NOT a subset of X</td><td>RollNo → Name (meaningful)</td></tr>
                            </table>
                        </div>
                    </div>
                    <div class="section">
                        <h2>Armstrong's Axioms — the rules of FDs</h2>
                        <div class="step">
                            <div class="step-header"><div class="step-num">1</div><div class="step-title">Reflexivity — if Y ⊆ X, then X → Y</div></div>
                            <div class="step-body">{Name, Age} → Name. A set always determines its own subset. These are trivial FDs.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">2</div><div class="step-title">Augmentation — if X → Y, then XZ → YZ</div></div>
                            <div class="step-body">If RollNo → Name, then {RollNo, Dept} → {Name, Dept}. Adding the same attribute to both sides preserves the FD.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">3</div><div class="step-title">Transitivity — if X→Y and Y→Z, then X→Z</div></div>
                            <div class="step-body">If RollNo→Dept and Dept→HOD, then RollNo→HOD. This is how transitive dependencies arise and why 3NF is needed.</div>
                        </div>
                    </div>
                    <div class="section">
                        <h2>Closure of an attribute set</h2>
                        <p>The closure of {X}<sup>+</sup> is the set of all attributes that can be derived from X using given FDs. Used to find candidate keys.</p>
                        <div class="code-block">FDs: A→B, B→C, C→D
Find closure of {A}:
  Start: {A}
  A→B: add B → {A,B}
  B→C: add C → {A,B,C}
  C→D: add D → {A,B,C,D}
Closure of {A}+ = {A,B,C,D}
Since closure = all attributes → A is a candidate key!</div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What is a functional dependency? How do you find candidate keys using closure? <span class="arrow">▾</span></div>
                            <div class="qa-a">A functional dependency X→Y means the value of X uniquely determines Y. To find candidate keys: compute the closure X+ for each attribute or combination. If X+ = all attributes in the relation, then X is a candidate key. Start with single attributes, then try pairs if none work individually. The minimal X whose closure gives all attributes is a candidate key.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. What is a minimal cover (canonical cover)? <span class="arrow">▾</span></div>
                            <div class="qa-a">A minimal cover (Fc) is an equivalent, simplified set of FDs with no redundancy. Steps: (1) Make all right-hand sides singleton (split A→BC into A→B, A→C). (2) Remove extraneous attributes from left-hand sides. (3) Remove redundant FDs. The result is the smallest set of FDs that preserves all dependencies. Used in 3NF synthesis algorithm.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q3. What is lossless decomposition? <span class="arrow">▾</span></div>
                            <div class="qa-a">Lossless decomposition means when you split a table into smaller tables, joining them back gives exactly the original table — no spurious (extra fake) rows, no data loss. A decomposition of R into R1 and R2 is lossless if R1∩R2 → R1 or R1∩R2 → R2 (the common attributes form a key of at least one fragment). Always verify decompositions are lossless before using them.</div>
                        </div>
                    </div>
                `
            },
            {
                id: 't3',
                label: 'SQL Joins (all types)',
                html: `
                    <div class="section">
                        <h2>What is a JOIN?</h2>
                        <p>A JOIN combines rows from two or more tables based on a related column. It's the most tested SQL topic in interviews.</p>
                        <div class="code-block">-- Sample tables used in all examples below:
STUDENT: RollNo | Name  | DeptID
           101  | Rahul |   10
           102  | Priya |   20
           103  | Arjun |   NULL

DEPT:    DeptID | DeptName
           10   | CS
           20   | IT
           30   | ECE</div>
                    </div>
                    <div class="section">
                        <h2>INNER JOIN</h2>
                        <p>Returns only rows that have matching values in both tables. Non-matching rows are excluded.</p>
                        <div class="code-block">SELECT S.Name, D.DeptName
FROM Student S INNER JOIN Dept D ON S.DeptID = D.DeptID;

Result:
Name  | DeptName
Rahul | CS
Priya | IT
-- Arjun excluded (DeptID is NULL, no match)
-- ECE excluded (no student in ECE)</div>
                    </div>
                    <div class="section">
                        <h2>LEFT JOIN (LEFT OUTER JOIN)</h2>
                        <p>Returns ALL rows from the left table, and matching rows from the right. Unmatched right side gets NULL.</p>
                        <div class="code-block">SELECT S.Name, D.DeptName
FROM Student S LEFT JOIN Dept D ON S.DeptID = D.DeptID;

Result:
Name  | DeptName
Rahul | CS
Priya | IT
Arjun | NULL   ← Arjun included even though no dept match</div>
                    </div>
                    <div class="section">
                        <h2>RIGHT JOIN & FULL OUTER JOIN</h2>
                        <div class="code-block">-- RIGHT JOIN: all rows from right table
SELECT S.Name, D.DeptName
FROM Student S RIGHT JOIN Dept D ON S.DeptID = D.DeptID;
Result:
Rahul | CS
Priya | IT
NULL  | ECE   ← ECE included even though no students

-- FULL OUTER JOIN: all rows from both tables
Result:
Rahul | CS
Priya | IT
Arjun | NULL
NULL  | ECE</div>
                    </div>
                    <div class="section">
                        <h2>CROSS JOIN & SELF JOIN</h2>
                        <div class="code-block">-- CROSS JOIN: Cartesian product (every row with every row)
SELECT * FROM Student CROSS JOIN Dept;
-- 3 students × 3 depts = 9 rows. No ON clause.

-- SELF JOIN: join a table with itself
-- Find students in the same department:
SELECT A.Name, B.Name, A.DeptID
FROM Student A JOIN Student B
ON A.DeptID = B.DeptID AND A.RollNo &lt; B.RollNo;</div>
                    </div>
                    <div class="section">
                        <h2>Join types at a glance</h2>
                        <div class="table-wrap">
                            <table>
                                <tr><th>Join type</th><th>Returns</th><th>NULLs from</th></tr>
                                <tr><td><span class="tag blue">INNER JOIN</span></td><td>Only matching rows</td><td>Neither side</td></tr>
                                <tr><td><span class="tag green">LEFT JOIN</span></td><td>All left + matching right</td><td>Right side</td></tr>
                                <tr><td><span class="tag amber">RIGHT JOIN</span></td><td>All right + matching left</td><td>Left side</td></tr>
                                <tr><td><span class="tag purple">FULL OUTER JOIN</span></td><td>All rows from both</td><td>Both sides</td></tr>
                                <tr><td><span class="tag coral">CROSS JOIN</span></td><td>Cartesian product</td><td>Neither (no ON)</td></tr>
                                <tr><td><span class="tag teal">SELF JOIN</span></td><td>Table joined with itself</td><td>As specified</td></tr>
                            </table>
                        </div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What is the difference between INNER JOIN and OUTER JOIN? <span class="arrow">▾</span></div>
                            <div class="qa-a">INNER JOIN returns only rows where both tables have matching values — unmatched rows from either table are discarded. OUTER JOIN preserves unmatched rows. LEFT OUTER keeps all left table rows; RIGHT OUTER keeps all right table rows; FULL OUTER keeps all rows from both tables, filling NULLs where no match exists.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. What is a SELF JOIN? When would you use it? <span class="arrow">▾</span></div>

                    <div class="section">
                        <h2>Aggregate functions</h2>
                        <p>Aggregate functions operate on a set of rows and return a single summary value. They are the backbone of reporting queries.</p>
                        <div class="card-row">
                            <div class="card"><div class="label">COUNT</div><div class="val">COUNT(*)</div><div class="sub">Number of rows</div></div>
                            <div class="card"><div class="label">SUM</div><div class="val">SUM(Marks)</div><div class="sub">Total of all values</div></div>
                            <div class="card"><div class="label">AVG</div><div class="val">AVG(Marks)</div><div class="sub">Average value</div></div>
                            <div class="card"><div class="label">MAX / MIN</div><div class="val">MAX(Marks)</div><div class="sub">Highest / lowest value</div></div>
                        </div>
                        <div class="code-block">SELECT COUNT(*) FROM Student;            -- total students
SELECT AVG(Marks) FROM Student;          -- average marks
SELECT MAX(Marks), MIN(Marks) FROM Student;
SELECT COUNT(DISTINCT Dept) FROM Student; -- unique depts</div>
                    </div>
                    <div class="section">
                        <h2>GROUP BY</h2>
                        <p>GROUP BY groups rows sharing a value into summary rows — one output row per group. Always used with aggregate functions.</p>
                        <div class="code-block">-- Average marks per department
SELECT Dept, AVG(Marks) AS AvgMarks
FROM Student
GROUP BY Dept;

Result:
Dept | AvgMarks
CS   | 83.5
IT   | 91.0
ECE  | 76.0</div>
                    </div>
                    <div class="section">
                        <h2>HAVING — filtering groups</h2>
                        <p>HAVING filters groups after GROUP BY. WHERE filters individual rows before grouping. They serve different purposes.</p>
                        <div class="code-block">-- Departments where average marks > 80
SELECT Dept, AVG(Marks) AS AvgMarks
FROM Student
WHERE Marks > 40          -- filter individual rows first
GROUP BY Dept
HAVING AVG(Marks) > 80;  -- filter groups after aggregation</div>
                        <div class="highlight"><strong>Rule:</strong> WHERE cannot use aggregate functions (MAX, AVG, etc.). HAVING can. WHERE runs before grouping; HAVING runs after.</div>
                    </div>
                    <div class="section">
                        <h2>SQL query execution order</h2>
                        <div class="step"><div class="step-header"><div class="step-num">1</div><div class="step-title">FROM — identify the table(s)</div></div></div>
                        <div class="step"><div class="step-header"><div class="step-num">2</div><div class="step-title">WHERE — filter individual rows</div></div></div>
                        <div class="step"><div class="step-header"><div class="step-num">3</div><div class="step-title">GROUP BY — group the remaining rows</div></div></div>
                        <div class="step"><div class="step-header"><div class="step-num">4</div><div class="step-title">HAVING — filter groups</div></div></div>
                        <div class="step"><div class="step-header"><div class="step-num">5</div><div class="step-title">SELECT — pick columns / compute expressions</div></div></div>
                        <div class="step"><div class="step-header"><div class="step-num">6</div><div class="step-title">ORDER BY — sort the result</div></div></div>
                        <div class="step"><div class="step-header"><div class="step-num">7</div><div class="step-title">LIMIT / OFFSET — return a slice</div></div></div>
                        <div class="remember">This order explains why you can't use a SELECT alias in WHERE — SELECT hasn't run yet when WHERE executes.</div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What is the difference between WHERE and HAVING? <span class="arrow">▾</span></div>

                        </div>
                    </div>

                    <div class="section">
                        <h2>What is a subquery?</h2>
                        <p>A subquery is a SELECT statement nested inside another SQL statement. The inner query runs first, and its result is used by the outer query.</p>
                        <div class="code-block">-- Find students scoring above average marks
SELECT Name, Marks FROM Student
WHERE Marks > (SELECT AVG(Marks) FROM Student);

-- Inner query runs first: AVG(Marks) = 83
-- Outer query: WHERE Marks > 83</div>
                    </div>
                    <div class="section">
                        <h2>Types of subqueries</h2>
                        <div class="table-wrap">
                            <table>
                                <tr><th>Type</th><th>Returns</th><th>Used with</th></tr>
                                <tr><td><span class="tag blue">Scalar</span></td><td>Single value</td><td>=, &gt;, &lt;, comparisons</td></tr>
                                <tr><td><span class="tag green">Row</span></td><td>Single row</td><td>= (row constructor)</td></tr>
                                <tr><td><span class="tag amber">Column/Table</span></td><td>Multiple rows</td><td>IN, ANY, ALL, EXISTS</td></tr>
                                <tr><td><span class="tag purple">Correlated</span></td><td>Runs per outer row</td><td>EXISTS, WHERE with outer ref</td></tr>
                            </table>
                        </div>
                    </div>
                    <div class="section">
                        <h2>IN, ANY, ALL with subqueries</h2>
                        <div class="code-block">-- IN: value matches any in the list
SELECT Name FROM Student
WHERE DeptID IN (SELECT DeptID FROM Dept WHERE DeptName='CS');

-- ALL: condition must hold for ALL values
SELECT Name FROM Student
WHERE Marks > ALL (SELECT Marks FROM Student WHERE Dept='IT');
-- Returns students scoring higher than EVERY IT student

-- ANY: condition holds for at least ONE value
SELECT Name FROM Student
WHERE Marks > ANY (SELECT Marks FROM Student WHERE Dept='IT');
-- Returns students scoring higher than at least one IT student</div>
                    </div>
                    <div class="section">
                        <h2>Correlated subquery</h2>
                        <p>A correlated subquery references a column from the outer query. It <strong>executes once for each row</strong> of the outer query — slower but powerful.</p>
                        <div class="code-block">-- Find students who score above their department average
SELECT S1.Name, S1.Marks, S1.Dept
FROM Student S1
WHERE S1.Marks > (
  SELECT AVG(S2.Marks)
  FROM Student S2
  WHERE S2.Dept = S1.Dept  ← references outer query's row
);
-- For each student, inner query runs with THAT student's dept</div>
                    </div>
                    <div class="section">
                        <h2>EXISTS vs IN</h2>
                        <div class="code-block">-- EXISTS: returns true if subquery returns any row
SELECT Name FROM Student S
WHERE EXISTS (
  SELECT 1 FROM Enrollment E WHERE E.RollNo = S.RollNo
);

-- IN: checks if value is in a list
SELECT Name FROM Student
WHERE RollNo IN (SELECT RollNo FROM Enrollment);</div>
                        <div class="highlight"><strong>EXISTS is faster</strong> when the subquery result is large — it stops at the first match. IN loads the entire list into memory. Use EXISTS with correlated subqueries for better performance.</div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What is the difference between a correlated and a non-correlated subquery? <span class="arrow">▾</span></div>
                            <div class="qa-a">A non-correlated subquery is independent — it executes once, its result is used by the outer query. Example: WHERE Marks > (SELECT AVG(Marks) FROM Student). A correlated subquery references a column from the outer query, so it executes once per row of the outer query. Much slower for large tables but necessary for row-by-row comparisons. You can often rewrite correlated subqueries using JOINs for better performance.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. When would you use EXISTS instead of IN? <span class="arrow">▾</span></div>
                            <div class="qa-a">Use EXISTS when: (1) The subquery could return a large number of rows — EXISTS short-circuits on first match. (2) The subquery involves NULL values — IN with NULLs can give unexpected results (IN fails to match NULLs). (3) You only need to check existence, not the actual values. Use IN when: the list is small and known, or you're matching against a literal list of values.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q3. Write a query to find departments with no students. <span class="arrow">▾</span></div>
                            <div class="qa-a">Three approaches: (1) NOT IN: SELECT DeptName FROM Dept WHERE DeptID NOT IN (SELECT DeptID FROM Student WHERE DeptID IS NOT NULL); (2) NOT EXISTS: SELECT DeptName FROM Dept D WHERE NOT EXISTS (SELECT 1 FROM Student S WHERE S.DeptID = D.DeptID); (3) LEFT JOIN: SELECT D.DeptName FROM Dept D LEFT JOIN Student S ON D.DeptID = S.DeptID WHERE S.RollNo IS NULL. Caution: NOT IN fails silently if the subquery returns any NULL — always prefer NOT EXISTS for safety.</div>
                        </div>
                    </div>
                `

                    <div class="section">
                        <h2>Views</h2>
                        <p>A view is a <strong>virtual table</strong> defined by a SELECT query. It doesn't store data itself — it's a saved query that looks like a table.</p>
                        <div class="code-block">-- Create a view
CREATE VIEW CS_Students AS
SELECT RollNo, Name, Marks
FROM Student WHERE Dept = 'CS';

-- Use it like a table
SELECT * FROM CS_Students WHERE Marks > 80;

-- Drop view
DROP VIEW CS_Students;</div>
                        <div class="card-row">
                            <div class="card"><div class="label">Use case</div><div class="val">Security</div><div class="sub">Show only salary columns to HR, not full Employee table</div></div>
                            <div class="card"><div class="label">Use case</div><div class="val">Simplicity</div><div class="sub">Hide complex JOINs behind a simple view name</div></div>
                            <div class="card"><div class="label">Use case</div><div class="val">Consistency</div><div class="sub">Same definition used across multiple queries</div></div>
                        </div>
                        <div class="highlight"><strong>Updatable views:</strong> A view is updatable only if it's based on a single table, has no GROUP BY, DISTINCT, aggregate functions, or complex expressions. Most real-world views are read-only.</div>
                    </div>
                    <div class="section">
                        <h2>Stored Procedures</h2>
                        <p>A stored procedure is a <strong>precompiled block of SQL</strong> stored in the database and executed by name. Supports parameters, loops, conditionals.</p>
                        <div class="code-block">DELIMITER $$
CREATE PROCEDURE GetTopStudents(IN min_marks INT)
BEGIN
  SELECT Name, Marks FROM Student
  WHERE Marks >= min_marks
  ORDER BY Marks DESC;
END$$
DELIMITER ;

-- Call it:
CALL GetTopStudents(85);</div>
                        <div class="remember">Stored procedures reduce network traffic, improve performance (precompiled), and enforce business logic at DB level — not just application level.</div>
                    </div>
                    <div class="section">
                        <h2>Triggers</h2>
                        <p>A trigger is SQL code that <strong>automatically executes in response to an event</strong> (INSERT, UPDATE, DELETE) on a table. You don't call it — it fires itself.</p>
                        <div class="code-block">-- Log every student deletion into an audit table
CREATE TRIGGER after_student_delete
AFTER DELETE ON Student
FOR EACH ROW
BEGIN
  INSERT INTO AuditLog(RollNo, Name, DeletedAt)
  VALUES (OLD.RollNo, OLD.Name, NOW());
END;</div>
                        <div class="table-wrap">
                            <table>
                                <tr><th>Trigger timing</th><th>When it fires</th></tr>
                                <tr><td><span class="tag blue">BEFORE INSERT/UPDATE/DELETE</span></td><td>Before the operation — can validate or modify data</td></tr>
                                <tr><td><span class="tag green">AFTER INSERT/UPDATE/DELETE</span></td><td>After the operation — used for audit logs, notifications</td></tr>
                            </table>
                        </div>
                        <p>Inside triggers: <code>NEW</code> refers to the new row being inserted/updated. <code>OLD</code> refers to the row before update/delete.</p>
                    </div>
                    <div class="section">
                        <h2>Procedure vs Function vs Trigger</h2>
                        <div class="table-wrap">
                            <table>
                                <tr><th></th><th>Stored Procedure</th><th>Function</th><th>Trigger</th></tr>
                                <tr><td>Called by</td><td>CALL explicitly</td><td>Used in SELECT</td><td>Fires automatically</td></tr>
                                <tr><td>Returns</td><td>Optional (OUT param)</td><td>Always returns value</td><td>Nothing</td></tr>
                                <tr><td>Transaction control</td><td>Yes (COMMIT/ROLLBACK)</td><td>No</td><td>Inherits parent</td></tr>
                                <tr><td>Use case</td><td>Business logic</td><td>Computation</td><td>Auto-audit, validation</td></tr>
                            </table>
                        </div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What is a view? Can you always update data through a view? <span class="arrow">▾</span></div>
                            <div class="qa-a">A view is a virtual table — a named SELECT query stored in the database. It doesn't store data. You can update through a view only if it's based on a single base table and doesn't use GROUP BY, DISTINCT, aggregate functions, UNION, or complex expressions. When a view involves JOINs, updating becomes ambiguous (which underlying table?), so most complex views are read-only. Use INSTEAD OF triggers to make complex views updatable.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. What are the advantages of stored procedures over plain SQL? <span class="arrow">▾</span></div>
                            <div class="qa-a">(1) Performance: precompiled and cached — no re-parsing on each call. (2) Network efficiency: one CALL instead of multiple SQL statements over the network. (3) Security: users can EXECUTE a procedure without having direct table access — reduces attack surface. (4) Maintainability: business logic centralized in DB, not scattered across app code. (5) Reusability: called from multiple applications or languages.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q3. What is the difference between a trigger and a stored procedure? <span class="arrow">▾</span></div>
                            <div class="qa-a">A stored procedure is explicitly called by a user or application using CALL. A trigger is implicitly invoked by the database engine when a specific DML event (INSERT, UPDATE, DELETE) occurs on a table — you never call it directly. Procedures can have parameters; triggers cannot. Triggers cannot be called manually or pass data back. Triggers are best for automatic enforcement of rules; procedures are best for reusable business logic.</div>
                        </div>
                    </div>
                `

                    <div class="section">
                        <h2>What is a transaction?</h2>
                        <p>A transaction is a <strong>unit of work</strong> — a sequence of SQL operations treated as a single all-or-nothing unit. Either all operations succeed (COMMIT) or all are undone (ROLLBACK).</p>
                        <div class="highlight">
                            <strong>Classic example — Bank Transfer:</strong><br>
                            Step 1: Deduct ₹1000 from Rahul's account<br>
                            Step 2: Add ₹1000 to Priya's account<br>
                            If Step 1 succeeds but Step 2 crashes — money is lost! A transaction ensures both steps succeed or neither does.
                        </div>
                        <div class="code-block">START TRANSACTION;
  UPDATE Account SET Balance = Balance - 1000 WHERE Name = 'Rahul';
  UPDATE Account SET Balance = Balance + 1000 WHERE Name = 'Priya';
COMMIT;  -- make permanent

-- On any error:
ROLLBACK;  -- undo everything back to START TRANSACTION</div>
                    </div>
                    <div class="section">
                        <h2>ACID Properties — the 4 guarantees</h2>
                        <div class="step">
                            <div class="step-header"><div class="step-num">A</div><div class="step-title">Atomicity — all or nothing</div></div>
                            <div class="step-body">Either all operations in a transaction complete successfully, or none do. No partial execution. If the server crashes mid-transaction, the DBMS rolls back to the state before the transaction started.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">C</div><div class="step-title">Consistency — valid state to valid state</div></div>
                            <div class="step-body">A transaction brings the database from one consistent state to another. Business rules and constraints are never violated. After the bank transfer, total money in the system must remain the same.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">I</div><div class="step-title">Isolation — transactions don't interfere</div></div>
                            <div class="step-body">Concurrent transactions execute as if they were sequential. One transaction's intermediate state is invisible to others. Without isolation, two transactions reading/writing the same account simultaneously could corrupt data.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">D</div><div class="step-title">Durability — committed = permanent</div></div>
                            <div class="step-body">Once a transaction is committed, its changes survive even if the system crashes immediately after. Achieved via write-ahead logging (WAL) — changes are written to a log on disk before being applied.</div>
                        </div>
                    </div>
                    <div class="section">
                        <h2>SAVEPOINT — partial rollback</h2>
                        <div class="code-block">START TRANSACTION;
  INSERT INTO Orders VALUES (1, 'Laptop', 50000);
  SAVEPOINT sp1;
  INSERT INTO Orders VALUES (2, 'Mouse', 500);
  SAVEPOINT sp2;
  INSERT INTO Orders VALUES (3, 'Keyboard', 1500);

ROLLBACK TO sp2;  -- undoes keyboard insert only
COMMIT;          -- commits laptop + mouse</div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. Explain ACID properties with the bank transfer example. <span class="arrow">▾</span></div>
                            <div class="qa-a">Atomicity: both debit and credit happen together or neither does — no partial transfer. Consistency: before transfer, Rahul has ₹5000, Priya has ₹2000 (total ₹7000). After transfer: Rahul ₹4000, Priya ₹3000 (still ₹7000) — balance preserved. Isolation: if two transfers happen simultaneously, they don't see each other's intermediate states — each sees the other as complete or not started. Durability: once committed, the transfer record survives even if the server crashes in the next millisecond.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. What is the difference between COMMIT and ROLLBACK? <span class="arrow">▾</span></div>
                            <div class="qa-a">COMMIT permanently saves all changes made in the current transaction — they become visible to other users and survive crashes. ROLLBACK undoes all changes made since the last COMMIT or START TRANSACTION — the database returns to its previous consistent state. ROLLBACK TO SAVEPOINT undoes only to a named checkpoint within the transaction, keeping earlier operations intact.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q3. How does durability work internally? <span class="arrow">▾</span></div>
                            <div class="qa-a">Durability is implemented using Write-Ahead Logging (WAL). Before any data page is modified on disk, the change is first written to a sequential log file (redo log). On COMMIT, the log record is force-flushed to disk. If the system crashes after COMMIT, during recovery the DBMS replays the log to reapply committed changes. If it crashes before COMMIT, it uses the log to undo partial changes. The log is the source of truth for recovery.</div>
                        </div>
                    </div>
                `
            },

                id: 't8',
                label: 'Concurrency Problems',
                html: `
                    <div class="section">
                        <h2>Why concurrency problems occur</h2>
                        <p>When multiple transactions run simultaneously, they can interfere with each other and produce incorrect results. There are 4 classic problems.</p>
                    </div>
                    <div class="section">
                        <h2>Problem 1 — Dirty Read</h2>
                        <div class="code-block">T1: UPDATE Account SET Balance=5000 WHERE ID=1; (not committed yet)
T2: SELECT Balance FROM Account WHERE ID=1;  → reads 5000  ← DIRTY!
T1: ROLLBACK;  -- balance goes back to original
T2 used data that never actually existed!</div>
                        <div class="danger">T2 reads uncommitted data from T1. If T1 rolls back, T2 has acted on a "ghost" value. Prevented by: Read Committed isolation level.</div>
                    </div>
                    <div class="section">
                        <h2>Problem 2 — Non-repeatable Read</h2>
                        <div class="code-block">T1: SELECT Balance FROM Account WHERE ID=1;  → 3000
T2: UPDATE Account SET Balance=5000 WHERE ID=1; COMMIT;
T1: SELECT Balance FROM Account WHERE ID=1;  → 5000 ← DIFFERENT!
T1 read the same row twice and got different values within the same transaction.</div>
                        <div class="danger">A committed update by T2 changed what T1 sees. Prevented by: Repeatable Read isolation level.</div>
                    </div>
                    <div class="section">
                        <h2>Problem 3 — Phantom Read</h2>
                        <div class="code-block">T1: SELECT * FROM Student WHERE Marks > 80;  → 5 rows
T2: INSERT INTO Student VALUES (106,'Neha',95); COMMIT;
T1: SELECT * FROM Student WHERE Marks > 80;  → 6 rows ← PHANTOM!
A new row appeared — T1 sees a "phantom" it didn't see before.</div>
                        <div class="danger">A committed INSERT by T2 adds a row to T1's range query. Prevented by: Serializable isolation level.</div>
                    </div>
                    <div class="section">
                        <h2>Problem 4 — Lost Update</h2>
                        <div class="code-block">T1: reads Balance=1000
T2: reads Balance=1000
T1: sets Balance = 1000+500 = 1500, COMMITS
T2: sets Balance = 1000+300 = 1300, COMMITS  ← T1's update LOST!
Correct answer should be 1800 (1000+500+300)</div>
                        <div class="danger">T2 overwrites T1's committed change. Both read the same old value. Prevented by: locking or optimistic concurrency control.</div>
                    </div>
                    <div class="section">
                        <h2>Problems summary</h2>
                        <div class="table-wrap">
                            <table>
                                <tr><th>Problem</th><th>Cause</th><th>Prevented by isolation</th></tr>
                                <tr><td><span class="tag red">Dirty Read</span></td><td>Read uncommitted data</td><td>Read Committed</td></tr>
                                <tr><td><span class="tag amber">Non-repeatable Read</span></td><td>Row updated between 2 reads</td><td>Repeatable Read</td></tr>
                                <tr><td><span class="tag purple">Phantom Read</span></td><td>Rows inserted between 2 range reads</td><td>Serializable</td></tr>
                                <tr><td><span class="tag coral">Lost Update</span></td><td>Overwrite without checking latest value</td><td>Locking / Serializable</td></tr>
                            </table>
                        </div>
                    </div>
                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q1. What is the difference between dirty read and non-repeatable read? <span class="arrow">▾</span></div>
                            <div class="qa-a">Dirty read: T2 reads data that T1 wrote but hasn't committed yet. If T1 rolls back, T2 used data that never officially existed. Non-repeatable read: T2 reads a row, T1 updates and commits that row, T2 reads again and gets a different value. The difference: dirty read involves uncommitted data; non-repeatable read involves committed but changed data. Both involve the same row; phantom read involves new rows appearing.</div>
                        </div>
                        <div class="qa">
                            <div class="qa-q" onclick="tog(this)">Q2. What is the difference between non-repeatable read and phantom read? <span class="arrow">▾</span></div>
                            <div class="qa-a">Non-repeatable read: reading the SAME ROW twice gives different values because another transaction updated it. Phantom read: reading a range query twice gives different sets of rows because another transaction inserted or deleted rows matching the range. Non-repeatable = existing row changed. Phantom = new rows appeared/disappeared. Repeatable Read prevents non-repeatable reads but not phantoms. Serializable prevents both.</div>
                        </div>

                    <div class="section">
                        <h2>What is locking?</h2>
                        <p>Locks are mechanisms that control access to database resources when multiple transactions run simultaneously. They prevent concurrency problems by enforcing isolation.</p>

                            <div class="card"><div class="label">Shared lock (S)</div><div class="val">Read lock</div><div class="sub">Multiple transactions can hold shared locks on the same item simultaneously</div></div>
                            <div class="card"><div class="label">Exclusive lock (X)</div><div class="val">Write lock</div><div class="sub">Only ONE transaction can hold an exclusive lock. No other lock (S or X) allowed simultaneously</div></div>

                        <div class="table-wrap" style="margin-top:10px">
                            <table>
                                <tr><th>Lock compatibility</th><th>S (held)</th><th>X (held)</th></tr>

                            </table>
                        </div>

                    <div class="section">
                        <h2>Two-Phase Locking (2PL)</h2>
                        <p>2PL is a protocol that ensures serializability. A transaction must follow exactly two phases:</p>
                        <div class="step">
                            <div class="step-header"><div class="step-num">1</div><div class="step-title">Growing phase — acquire locks only, release none</div></div>
                            <div class="step-body">A transaction can acquire as many locks as it needs. It cannot release any lock during this phase. The point where it gets its last lock is called the <strong>lock point</strong>.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">2</div><div class="step-title">Shrinking phase — release locks only, acquire none</div></div>
                            <div class="step-body">Once the transaction releases its first lock, it enters the shrinking phase and can no longer acquire new locks. All locks are eventually released.</div>
                        </div>
                        <div class="remember"><strong>2PL guarantees serializability</strong> — but it does NOT prevent deadlocks. In fact, 2PL can cause deadlocks.</div>
                    </div>

                        <div class="card-row">
                            <div class="card"><div class="label">Basic 2PL</div><div class="val">As above</div><div class="sub">Serializable but allows cascading rollbacks</div></div>
                            <div class="card"><div class="label">Strict 2PL</div><div class="val">Hold X-locks till commit</div><div class="sub">Prevents cascading rollbacks. Most common in practice.</div></div>

T2 holds lock on B, wants A
→ Both wait forever = DEADLOCK</div>

                            <div class="card"><div class="label">Prevention</div><div class="val">Lock ordering</div><div class="sub">All transactions lock resources in the same order. Breaks circular wait.</div></div>

    ↓        ↓       ↓       ↓
  rows     rows    rows    rows (actual data pointers)

Query: WHERE Marks = 55
