            <div class="section">
                <h2>Problem statement</h2>
                <p>Design Splitwise — a bill-splitting app where users can add expenses, split them equally or by percentage, track who owes whom, and settle debts with a minimum number of transactions.</p>
            </div>
            <div class="section">
                <h2>Entities & design decisions</h2>
                <div class="card-row">
                    <div class="card"><div class="lbl">Core entities</div><div class="val">User, Group, Expense</div><div class="sub">Split, Balance, Settlement</div></div>
                    <div class="card"><div class="lbl">Split types</div><div class="val">Equal, Exact, Percent</div><div class="sub">Strategy pattern — each split type is a strategy</div></div>

                <h2>Full C++ implementation</h2>
                <div class="cb">#include &lt;iostream&gt;
#include &lt;map&gt;
#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;algorithm&gt;
#include &lt;cmath&gt;
using namespace std;

enum class SplitType { EQUAL, EXACT, PERCENT };

struct Split {
    int    userId;
    double amount;
    Split(int u, double a) : userId(u), amount(a) {}
};

class SplitStrategy {
public:
    virtual vector&lt;Split&gt; compute(double total, vector&lt;int&gt; members, vector&lt;double&gt; values={}) = 0;
    virtual ~SplitStrategy(){}
};

class EqualSplit : public SplitStrategy {
public:
    vector&lt;Split&gt; compute(double total, vector&lt;int&gt; members, vector&lt;double&gt; vals={}) override {
        double each = total / members.size();
        vector&lt;Split&gt; splits;
        for (int uid : members) splits.push_back({uid, each});
        return splits;
    }
};

class ExactSplit : public SplitStrategy {
public:
    vector&lt;Split&gt; compute(double total, vector&lt;int&gt; members, vector&lt;double&gt; vals) override {
        vector&lt;Split&gt; splits;
        for (int i=0;i&lt;members.size();i++) splits.push_back({members[i], vals[i]});
        return splits;
    }
};

class PercentSplit : public SplitStrategy {
public:
    vector&lt;Split&gt; compute(double total, vector&lt;int&gt; members, vector&lt;double&gt; percents) override {
        vector&lt;Split&gt; splits;
        for (int i=0;i&lt;members.size();i++) splits.push_back({members[i], total*percents[i]/100.0});
        return splits;
    }
};

struct User {
    int    id;
    string name;
    User(int i, string n) : id(i), name(n) {}
    User() : id(0), name("") {} // default constructor for map
};

struct Expense {
    static int counter;
    int    id, paidBy;
    double amount;
    string description;
    vector&lt;Split&gt; splits;
    Expense(int paid, double amt, string desc, vector&lt;Split&gt; sp)
        : id(++counter), paidBy(paid), amount(amt), description(desc), splits(sp){}
};
int Expense::counter = 0;

class SplitwiseApp {
    map&lt;int,User&gt;    users;
    vector&lt;Expense&gt;  expenses;
    map&lt;int,map&lt;int,double&gt;&gt; balances; // balances[A][B] = B owes A

    EqualSplit   eqSplit;
    ExactSplit   exSplit;
    PercentSplit pcSplit;

public:
    void addUser(int id, string name) {
        users[id] = User(id, name);
        cout &lt;&lt; "[+] User: " &lt;&lt; name &lt;&lt; " (id=" &lt;&lt; id &lt;&lt; ")\n";
    }

    void addExpense(int paidBy, double amount, string desc,
                    vector&lt;int&gt; members, SplitType type, vector&lt;double&gt; vals={}) {
        vector&lt;Split&gt; splits;
        if      (type==SplitType::EQUAL)   splits = eqSplit.compute(amount, members);
        else if (type==SplitType::EXACT)   splits = exSplit.compute(amount, members, vals);
        else                               splits = pcSplit.compute(amount, members, vals);

        expenses.push_back(Expense(paidBy, amount, desc, splits));

        cout &lt;&lt; "\n[Expense] \"" &lt;&lt; desc &lt;&lt; "\" Rs." &lt;&lt; amount
             &lt;&lt; " paid by " &lt;&lt; users[paidBy].name &lt;&lt; "\n";

        for (auto&amp; sp : splits) {
            if (sp.userId == paidBy) continue;
            balances[paidBy][sp.userId] += sp.amount;
            cout &lt;&lt; "  " &lt;&lt; users[sp.userId].name &lt;&lt; " owes "
                 &lt;&lt; users[paidBy].name &lt;&lt; " Rs." &lt;&lt; sp.amount &lt;&lt; "\n";
        }
    }

    void showBalances() {
        cout &lt;&lt; "\n=== Current Balances ===\n";
        bool any = false;
        for (auto&amp; [creditor, debtors] : balances)
            for (auto&amp; [debtor, amt] : debtors)
                if (amt &gt; 0.01) {
                    cout &lt;&lt; "  " &lt;&lt; users[debtor].name &lt;&lt; " owes "
                         &lt;&lt; users[creditor].name &lt;&lt; " Rs." &lt;&lt; amt &lt;&lt; "\n";
                    any = true;
                }
        if (!any) cout &lt;&lt; "  All settled up!\n";
    }

    // Debt simplification: minimum transactions using net balance
    void simplifyDebts() {
        map&lt;int,double&gt; net;
        for (auto&amp; [creditor, debtors] : balances)
            for (auto&amp; [debtor, amt] : debtors)
                if (amt &gt; 0.01) { net[creditor] += amt; net[debtor] -= amt; }

        vector&lt;pair&lt;double,int&gt;&gt; pos, neg;
        for (auto&amp; [uid, bal] : net) {
            if (bal &gt;  0.01) pos.push_back({bal,  uid});
            if (bal &lt; -0.01) neg.push_back({-bal, uid});
        }
        sort(pos.rbegin(), pos.rend());
        sort(neg.rbegin(), neg.rend());

        cout &lt;&lt; "\n=== Simplified Settlements ===\n";
        int i=0, j=0;
        while (i&lt;pos.size() &amp;&amp; j&lt;neg.size()) {
            double settle = min(pos[i].first, neg[j].first);
            cout &lt;&lt; "  " &lt;&lt; users[neg[j].second].name &lt;&lt; " pays "
                 &lt;&lt; users[pos[i].second].name &lt;&lt; " Rs." &lt;&lt; settle &lt;&lt; "\n";
            pos[i].first -= settle; neg[j].first -= settle;
            if (pos[i].first &lt; 0.01) i++;
            if (neg[j].first &lt; 0.01) j++;
        }
    }

    void settle(int fromId, int toId) {
        if (balances[toId][fromId] &gt; 0.01) {
            cout &lt;&lt; "\n[Settled] " &lt;&lt; users[fromId].name &lt;&lt; " paid "
                 &lt;&lt; users[toId].name &lt;&lt; " Rs." &lt;&lt; balances[toId][fromId] &lt;&lt; "\n";
            balances[toId][fromId] = 0;
        }
    }
};

int main() {

    app.addExpense(1, 1200, "Dinner", {1,2,3,4}, SplitType::EQUAL);

    app.addExpense(2, 900, "Movie tickets", {1,2,3}, SplitType::EXACT, {300,300,300});

    // Percent split: Arjun pays Rs.2000 hotel (50/30/20)
    app.addExpense(3, 2000, "Hotel", {1,2,3}, SplitType::PERCENT, {50,30,20});

    app.showBalances();
    app.simplifyDebts();

    app.settle(2, 1);
    app.showBalances();
}</div>

            <div class="section">
                <h2>Problem statement</h2>
                <p>Design a Rate Limiter that prevents any client from making more than N requests per time window. Implement and compare three algorithms: Token Bucket, Leaky Bucket, and Sliding Window Counter.</p>

            <div class="section">
                <h2>Algorithm 1: Token Bucket</h2>
                <p>A bucket holds tokens. Each request consumes one token. Tokens refill at a fixed rate. Allows bursts up to bucket capacity. Most popular — used by AWS, Stripe, Nginx.</p>
                <div class="cb">#include &lt;iostream&gt;
#include &lt;chrono&gt;
#include &lt;thread&gt;
#include &lt;vector&gt;
#include &lt;algorithm&gt;
#include &lt;string&gt;
using namespace std;
using namespace chrono;

class TokenBucket {
    double capacity;    // max tokens
    double tokens;      // current tokens
    double refillRate;  // tokens per second
    time_point&lt;steady_clock&gt; lastRefill;
    string clientId;

    void refill() {
        auto now = steady_clock::now();
        double elapsed = duration&lt;double&gt;(now - lastRefill).count();
        tokens = min(capacity, tokens + elapsed * refillRate);
        lastRefill = now;
    }
public:
    TokenBucket(string id, double cap, double rate)
        : clientId(id), capacity(cap), tokens(cap),
          refillRate(rate), lastRefill(steady_clock::now()) {}

    bool allow() {
        refill();
        if (tokens &gt;= 1.0) { tokens -= 1.0; return true; }
        return false;
    }
    void status() {
        cout &lt;&lt; "  [" &lt;&lt; clientId &lt;&lt; "] tokens=" &lt;&lt; (int)tokens &lt;&lt; "/" &lt;&lt; (int)capacity &lt;&lt; "\n";
    }
};

class Algorithm2_SlidingWindow {
    string clientId;
    int limit;
    int windowSeconds;
    vector&lt;time_point&lt;steady_clock&gt;&gt; requests;
public:
    Algorithm2_SlidingWindow(string id, int lim, int win)
        : clientId(id), limit(lim), windowSeconds(win) {}

    bool allow() {
        auto now = steady_clock::now();
        auto windowStart = now - seconds(windowSeconds);
        // Remove old requests outside the window
        requests.erase(remove_if(requests.begin(), requests.end(),
            [&amp;](auto&amp; t){ return t &lt; windowStart; }), requests.end());
        if ((int)requests.size() &lt; limit) {
            requests.push_back(now);
            return true;
        }
        return false;
    }
    int currentCount() { return requests.size(); }
};

int main() {
    cout &lt;&lt; "=== Token Bucket (cap=5, refill=2/sec) ===\n";
    TokenBucket tb("user_1", 5, 2);

    for (int i=1; i&lt;=8; i++) {
        bool ok = tb.allow();
        cout &lt;&lt; "Request " &lt;&lt; i &lt;&lt; ": " &lt;&lt; (ok ? "ALLOWED" : "BLOCKED");
        tb.status();
        if (i==5) {
            cout &lt;&lt; "  [sleeping 1.5s to refill...]\n";
            this_thread::sleep_for(milliseconds(1500));
        }
    }

    cout &lt;&lt; "\n=== Sliding Window (5 req per 2 sec) ===\n";
    Algorithm2_SlidingWindow sw("user_2", 5, 2);
    for (int i=1; i&lt;=7; i++) {
        bool ok = sw.allow();
        cout &lt;&lt; "Request " &lt;&lt; i &lt;&lt; ": " &lt;&lt; (ok ? "ALLOWED" : "BLOCKED")
             &lt;&lt; " (window count=" &lt;&lt; sw.currentCount() &lt;&lt; ")\n";
        if (i==5) {
            cout &lt;&lt; "  [sleeping 2.1s — window resets]\n";
            this_thread::sleep_for(milliseconds(2100));
        }
    }
}</div>

const string BASE62 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

class URLEncoder {
public:
    static string encode(long long id) {
        string result;
        while (id &gt; 0) {
            result = BASE62[id % 62] + result;
            id /= 62;
        }
        while (result.size() &lt; 7) result = "0" + result;
        return result;
    }
    static long long decode(const string&amp; code) {
        long long id = 0;
        for (char c : code) {
            id = id * 62 + BASE62.find(c);
        }
        return id;
    }
};

        string code = URLEncoder::encode(counter++);
        shortToLong[code]  = longUrl;
        longToShort[longUrl] = code;
        clickCount[code]   = 0;

        string shortUrl = domain + code;

            <div class="section">
                <h2>The problem with simple modulo hashing</h2>
                <p>With N servers and hash function <code>server = key % N</code>: adding or removing one server changes N → N±1, causing almost all keys to remap to different servers. For a cache with millions of keys, this is a catastrophic cache miss storm.</p>
                <div class="hl">Adding 1 server to a pool of 10 causes ~90% of cached keys to move. Consistent hashing reduces this to ~1/N of keys (about 10%).</div>
            </div>
            <div class="section">
                <h2>How consistent hashing works</h2>
                <div class="arch">Conceptual ring (0 to 2^32):

          0
        /   \
   Server3   Server1
      |           |
   Server2───────┘
      
Each server is hashed to a position on the ring.
Each key is hashed to a position on the ring.
Key → nearest server clockwise.

Add Server4 between Server2 and Server3:
  Only keys between Server2 and Server4 move.
  All other keys unaffected.
  ≈ 1/N keys move (not all of them).</div>
            </div>
            <div class="section">
                <h2>Full C++ implementation with virtual nodes</h2>
                <div class="code-block">#include &lt;iostream&gt;
#include &lt;map&gt;
#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;functional&gt;
using namespace std;

class ConsistentHashRing {
    map&lt;size_t, string&gt; ring;  // position → server name
    int virtualNodes;
    hash&lt;string&gt; hasher;

    size_t getHash(const string&amp; key) { return hasher(key); }

public:
    ConsistentHashRing(int vnodes=3) : virtualNodes(vnodes) {}

    void addServer(const string&amp; server) {
        for (int i=0; i&lt;virtualNodes; i++) {
            string vnode = server + "#" + to_string(i);
            size_t pos = getHash(vnode);
            ring[pos] = server;
        }
        cout &lt;&lt; "[+] Server \"" &lt;&lt; server &lt;&lt; "\" added (" &lt;&lt; virtualNodes &lt;&lt; " vnodes)\n";
    }

    void removeServer(const string&amp; server) {
        for (int i=0; i&lt;virtualNodes; i++) {
            string vnode = server + "#" + to_string(i);
            ring.erase(getHash(vnode));
        }
        cout &lt;&lt; "[-] Server \"" &lt;&lt; server &lt;&lt; "\" removed\n";
    }

    string getServer(const string&amp; key) {
        if (ring.empty()) return "";
        size_t pos = getHash(key);
        auto it = ring.lower_bound(pos);     // first server &gt;= pos
        if (it == ring.end()) it = ring.begin(); // wrap around
        return it-&gt;second;
    }

    void showDistribution(const vector&lt;string&gt;&amp; keys) {
        map&lt;string, int&gt; dist;
        for (auto&amp; k : keys) dist[getServer(k)]++;
        cout &lt;&lt; "\n[Distribution across " &lt;&lt; dist.size() &lt;&lt; " servers]\n";
        for (auto&amp; [s, cnt] : dist)
            cout &lt;&lt; "  " &lt;&lt; s &lt;&lt; ": " &lt;&lt; cnt &lt;&lt; " keys\n";
    }
};

int main() {
    ConsistentHashRing ring(100); // 100 virtual nodes per server

    ring.addServer("cache-1");
    ring.addServer("cache-2");
    ring.addServer("cache-3");

    vector&lt;string&gt; keys;
    for (int i=1; i&lt;=300; i++) keys.push_back("user_" + to_string(i));

    cout &lt;&lt; "\n--- Before adding server ---";
    ring.showDistribution(keys);

    // Track where specific keys live before change
    vector&lt;string&gt; tracked = {"user_1","user_50","user_100","user_150","user_200"};
    cout &lt;&lt; "\n--- Key assignments before cache-4 ---\n";
    for (auto&amp; k : tracked)
        cout &lt;&lt; "  " &lt;&lt; k &lt;&lt; " → " &lt;&lt; ring.getServer(k) &lt;&lt; "\n";

    ring.addServer("cache-4");

    cout &lt;&lt; "\n--- Key assignments after cache-4 ---\n";
    int moved = 0;
    for (auto&amp; k : tracked) {
        string server = ring.getServer(k);
        cout &lt;&lt; "  " &lt;&lt; k &lt;&lt; " → " &lt;&lt; server &lt;&lt; "\n";
    }

    cout &lt;&lt; "\n--- Distribution after adding cache-4 ---";
    ring.showDistribution(keys);

    ring.removeServer("cache-2");
    cout &lt;&lt; "\n--- Distribution after removing cache-2 ---";
    ring.showDistribution(keys);
}</div>

            <div class="section">
                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. Why do we use virtual nodes in consistent hashing? <span class="arr">▾</span></div><div class="qa-a">Without virtual nodes: each physical server occupies one position on the ring. With 3 servers and random hash positions, the distribution can be very uneven — Server A might handle 70% of keys and Server C only 10%. Virtual nodes: each server occupies multiple positions (100-200 virtual nodes). The more positions a server has, the more balanced the distribution. When a server is added: it takes ~1/N fraction of keys from each other server (not just the one adjacent to it). This gives much better load distribution. In production (Cassandra, Amazon DynamoDB): each physical server gets 256+ virtual node positions.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. Where is consistent hashing used in real systems? <span class="arr">▾</span></div><div class="qa-a">(1) Cassandra — uses consistent hashing to distribute data across nodes. Each row is assigned to a node based on the hash of its partition key. (2) DynamoDB — similar ring-based partitioning, each partition key maps to a server. (3) Redis Cluster — 16,384 hash slots distributed across nodes using consistent hashing. (4) CDN routing — Akamai and Cloudflare hash content IDs to edge servers. Adding a new PoP only moves ~1/N content. (5) Load balancers — sticky sessions (hash user ID to server) with consistent hashing means adding a server doesn't invalidate most session affinity mappings.</div></div>

    void register_(string name, function&lt;string(string)&gt; handler) {
        services[name] = handler;
        cout &lt;&lt; "[Registry] Service registered: " &lt;&lt; name &lt;&lt; "\n";
    }
    string call(string service, string payload) {
        if (!services.count(service))
            return "{error: service_not_found}";
        cout &lt;&lt; "  [HTTP] → " &lt;&lt; service &lt;&lt; " payload=" &lt;&lt; payload &lt;&lt; "\n";
        string resp = services[service](payload);
        cout &lt;&lt; "  [HTTP] ← " &lt;&lt; service &lt;&lt; " response=" &lt;&lt; resp &lt;&lt; "\n";
        return resp;
    }
};

ServiceRegistry registry;

void setupServices() {
    registry.register_("AuthService", [](string token){
        return token == "valid_token" ? "{userId:42,ok:true}" : "{ok:false,err:unauthorized}";
    });
    registry.register_("InventoryService", [](string item){
        return item == "Laptop" ? "{available:true,qty:5}" : "{available:false}";
    });
    registry.register_("PaymentService", [](string payload){
        return "{status:success,txnId:TXN_9821}";
    });
    registry.register_("NotificationService", [](string msg){
        cout &lt;&lt; "    [Email/SMS sent] " &lt;&lt; msg &lt;&lt; "\n";
        return "{sent:true}";
    });
    registry.register_("ShippingService", [](string order){
        return "{trackingId:SHIP_7432,eta:\"2 days\"}";
    });
}

void placeOrder(string token, string item, double price) {
    cout &lt;&lt; "\n=== PlaceOrder: " &lt;&lt; item &lt;&lt; " @ Rs." &lt;&lt; price &lt;&lt; " ===\n";

    // 1. Auth
    string auth = registry.call("AuthService", token);
    if (auth.find("false") != string::npos) {
        cout &lt;&lt; "[DENIED] Auth failed\n"; return;
    }
    // 2. Inventory
    string inv = registry.call("InventoryService", item);
    if (inv.find("false") != string::npos) {
        cout &lt;&lt; "[DENIED] Out of stock\n"; return;
    }
    // 3. Payment
    registry.call("PaymentService", "{item:" + item + ",price:" + to_string((int)price) + "}");
    // 4. Shipping
    string ship = registry.call("ShippingService", "{item:" + item + "}");
    // 5. Notify
    registry.call("NotificationService", "Order confirmed: " + item);

    cout &lt;&lt; "[SUCCESS] Order placed! " &lt;&lt; ship &lt;&lt; "\n";
}

                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the "two generals problem" in distributed microservices? <span class="arr">▾</span></div><div class="qa-a">In microservices, you can't guarantee that a remote service received your request — the network is unreliable. Example: PaymentService deducted money, then the HTTP call to OrderService timed out. Did the order get placed or not? This is the distributed consistency problem. Solutions: (1) Saga pattern — long-running transactions broken into steps with compensating transactions for rollback. (2) Outbox pattern — write to local DB and a message queue table atomically; a separate process publishes the event. (3) Idempotent APIs — every operation has a unique idempotency key; if retried, no duplicate effect. You must design for partial failures in distributed systems.</div></div>
