                    <div class="section">
                        <h2>What is Inheritance?</h2>
                        <p>Inheritance allows a <strong>Child (Derived) class</strong> to inherit properties and behaviors from a <strong>Parent (Base) class</strong>. It promotes code reusability and builds a hierarchical relationship.</p>
                        <div class="highlight"><strong>Real-world Analogy:</strong> A "Vehicle" is a parent class. "Car", "Truck", and "Motorcycle" are child classes. They inherit common features like "engine" and "speed" but add unique options.</div>
                    </div>
                    <div class="section">

                                <tr><th>Type</th><th>Structure</th><th>Description</th></tr>
                                <tr><td><span class="tag blue">Single</span></td><td>A → B</td><td>One child inherits from exactly one parent.</td></tr>
                                <tr><td><span class="tag purple">Multilevel</span></td><td>A → B → C</td><td>A child inherits from a parent, which is also a child of another class.</td></tr>

                                <tr><td><span class="tag amber">Hierarchical</span></td><td>A → {B, C}</td><td>Multiple child classes inherit from a single parent class.</td></tr>
                                <tr><td><span class="tag teal">Hybrid</span></td><td>Mix of above</td><td>A combination of two or more types of inheritance.</td></tr>
                            </table>

                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

class MathOperations {
public:
    // 1. Compile-Time Polymorphism (Function Overloading)
    int add(int a, int b) { return a + b; }
    int add(int a, int b, int c) { return a + b + c; }
};

class Animal {
public:
    // Virtual keyword enables Runtime Polymorphism
    virtual void makeSound() { cout &lt;&lt; "Some animal sound..." &lt;&lt; endl; }
};

class Dog : public Animal {
public:
    // 2. Runtime Polymorphism (Method Overriding)
    void makeSound() override { cout &lt;&lt; "Woof Woof!" &lt;&lt; endl; }
};

int main() {
    // Overloading Check
    MathOperations mo;
    cout &lt;&lt; mo.add(5, 10) &lt;&lt; endl;

    // Overriding Check using Base Pointer
    Animal* animalPtr = new Dog();
    animalPtr-&gt;makeSound(); 
    
    delete animalPtr;
    return 0;
}

15

class Parent {

    void show() { cout &lt;&lt; "Executing Parent show()." &lt;&lt; endl; }

public:

                        <div class="code-block">#include &lt;iostream&gt;
#include &lt;exception&gt;
using namespace std;

// Creating a Custom Exception Class
class OverdraftException : public exception {
public:
    // Overriding the standard exception message function
    const char* what() const throw() override {
        return "Transaction Denied: Account balance cannot drop below zero!";
    }
};

class Account {
public:
    int balance = 100;
    
    void withdraw(int amount) {
        if (amount &gt; balance) {
            throw OverdraftException(); // Throwing custom exception
        }
        balance -= amount;
        cout &lt;&lt; "Withdrawal successful. Remaining: " &lt;&lt; balance &lt;&lt; endl;
    }
};

int main() {

        cout &lt;&lt; "Caught Error: " &lt;&lt; e.what() &lt;&lt; endl;
    }
    catch (...) {
        cout &lt;&lt; "Caught generic fallback exception." &lt;&lt; endl;
    }
    return 0;
}

            const arrow = el.querySelector('.arrow');
            
            if (ans.classList.contains('open')) {
                ans.classList.remove('open');
                arrow.classList.remove('open');
            } else {
