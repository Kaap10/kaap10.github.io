                    <div class="section">
                        <h2>The Problem: Procedural Programming</h2>
                        <p>Before OOPs, we used Procedural Programming (like C). Code was just a long list of functions operating on global data. As programs grew, data became messy, insecure, and hard to manage.</p>
                        <div class="highlight"><strong>Analogy:</strong> In a procedural bank, "balance" is a global variable. Any function (deposit, withdraw, or even a random unrelated function) can accidentally change the balance. It's unsafe!</div>

                        <h2>The Solution: OOPs</h2>

                    <div class="section">
                        <h2>What is a Class?</h2>

    // Method / Member Function
    void drive() {
        cout &lt;&lt; brand &lt;&lt; " is driving at " &lt;&lt; speed &lt;&lt; " km/h!" &lt;&lt; endl;

};

}</div>

                    <div class="section">
                        <h2>What is Encapsulation?</h2>

                        <div class="code-block">class BankAccount {
private:

    }

    }

                    <div class="section">
                        <h2>What is Abstraction?</h2>
                        <p>Abstraction means <strong>displaying only essential information and hiding the internal complex details</strong>. You just focus on <em>what</em> the object does, not <em>how</em> it does it.</p>
                        <div class="highlight"><strong>Real-world analogy:</strong> Driving a car. You press the accelerator to speed up. You don't need to know how the fuel pump injects gas into the engine combustion chamber. The complexity is hidden!</div>

                    <div class="section">
                        <h2>How to achieve Abstraction in C++?</h2>
                        <p>Abstraction is usually achieved using <strong>Abstract Classes</strong>. A class becomes abstract if it has at least one <strong>Pure Virtual Function</strong>.</p>
                        <p>A pure virtual function is a function declared in a parent class that has no body (it equals 0). The child class is <em>forced</em> to provide the implementation.</p>

// Abstract Class (cannot create objects of this)
class CoffeeMachine {
public:
    // Pure Virtual Function
    virtual void makeCoffee() = 0; 
};

// Concrete Class
class BasicCoffeeMachine : public CoffeeMachine {
private:
    void boilWater() { cout &lt;&lt; "Boiling water..." &lt;&lt; endl; }
    void addBeans() { cout &lt;&lt; "Adding beans..." &lt;&lt; endl; }

public:
    // Implementing the pure virtual function
    void makeCoffee() override {
        boilWater();
        addBeans();
        cout &lt;&lt; "Coffee is ready!" &lt;&lt; endl;
    }
};

int main() {

    myMachine.makeCoffee(); // User only sees this simple method!
    return 0;
}</div>

                    <div class="section">
                        <h2>What does "static" mean?</h2>
                        <p>Normally, every object gets its own separate copy of the class variables. But if a variable is declared <strong>static</strong>, there is only <strong>one shared copy</strong> for the entire class, regardless of how many objects are created.</p>
                        <div class="highlight"><strong>Analogy:</strong> If students are objects, <code>student_name</code> is normal (everyone has their own name). But <code>school_name</code> should be static (all students share the exact same school name).</div>

                        <h2>Static Variables & Static Methods</h2>

                            <li><strong>Static Variable:</strong> Initialized only once. Shared among all objects. Must be defined outside the class in C++.</li>
                            <li><strong>Static Method:</strong> Can only access static variables. Can be called directly using the Class name, without creating an object.</li>
                        </ul>

using namespace std;

class Player {
public:
    string name;
    
    // Static variable declaration
    static int playerCount; 

    Player(string n) {
        name = n;
        playerCount++; // Increment the shared counter
    }

    // Static method
    static void showCount() {
        cout &lt;&lt; "Total Players in game: " &lt;&lt; playerCount &lt;&lt; endl;
        // cout &lt;&lt; name; // ERROR! Static methods can't access non-static data.

};

// IMPORTANT: Initialize static variable outside the class in C++
int Player::playerCount = 0;

int main() {
    Player p1("Rahul");
    Player p2("Priya");
    Player p3("Arjun");

    // Call static method using Class Name and scope resolution ::
    Player::showCount(); // Output: Total Players in game: 3
    
    return 0;
}</div>
                    </div>

            const btn = document.createElement('button');
            btn.textContent = t.label;
            btn.className = i === 0 ? 'active' : '';
            
            btn.onclick = () => {
                document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(t.id).classList.add('active');
            };
            
            nav.appendChild(btn);

            const page = document.createElement('div');
            page.className = 'page' + (i === 0 ? ' active' : '');
            page.id = t.id;
            page.innerHTML = t.html;
            pages.appendChild(page);
        });

        function tog(el) {
            const ans = el.nextElementSibling;
            const arrow = el.querySelector('.arrow');
            ans.classList.toggle('open');
            arrow.classList.toggle('open');
        }
    </script>
</body>
</html>
