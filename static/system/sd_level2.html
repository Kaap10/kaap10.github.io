                    <div class="section">
                        <h2>What are creational patterns?</h2>
                        <p>Creational patterns deal with <strong>how objects are created</strong>. They abstract the instantiation process so your code doesn't depend on specific classes. There are 5 key ones — all appear in LLD interviews.</p>
                    </div>
                    <div class="section">
                        <h2>1. Singleton — one instance only</h2>
                        <p>Ensures only one instance of a class exists. All access goes through a single global point.</p>
                        <p>Real use: Logger, Config manager, Database connection pool, ParkingLot manager.</p>
                        <div class="code-block">#include &lt;iostream&gt;
#include &lt;mutex&gt;
using namespace std;

class Logger {
    static Logger* instance;
    static mutex   mtx;
    int logCount = 0;

    Logger() { cout &lt;&lt; "[Logger] Instance created.\n"; }
public:
    Logger(const Logger&amp;) = delete;
    Logger&amp; operator=(const Logger&amp;) = delete;

    static Logger* getInstance() {
        lock_guard&lt;mutex&gt; lock(mtx);
        if (!instance) instance = new Logger();
        return instance;
    }
    void log(const string&amp; msg) {
        cout &lt;&lt; "[LOG #" &lt;&lt; ++logCount &lt;&lt; "] " &lt;&lt; msg &lt;&lt; "\n";
    }
    int getCount() { return logCount; }
};
Logger* Logger::instance = nullptr;
mutex   Logger::mtx;

int main() {
    Logger* l1 = Logger::getInstance();
    Logger* l2 = Logger::getInstance();
    l1-&gt;log("Server started");
    l2-&gt;log("User logged in");
    l1-&gt;log("Payment processed");
    cout &lt;&lt; "Same instance? " &lt;&lt; (l1 == l2 ? "YES" : "NO") &lt;&lt; "\n";
    cout &lt;&lt; "Total logs: " &lt;&lt; l2-&gt;getCount() &lt;&lt; "\n";
}</div>
                        <div class="out-label">Output</div>
                        <div class="out-block">[Logger] Instance created.
[LOG #1] Server started
[LOG #2] User logged in
[LOG #3] Payment processed
Same instance? YES
Total logs: 3</div>
                    </div>
                    <div class="section">
                        <h2>2. Factory — delegate object creation</h2>
                        <p>A factory method creates objects without specifying the exact class. The caller just asks for a type — the factory decides what to instantiate.</p>
                        <div class="code-block">class Shape {
public:
    virtual void draw() = 0;
    virtual ~Shape() {}
};
class Circle    : public Shape { void draw() override { cout &lt;&lt; "Drawing Circle\n"; } };
class Rectangle : public Shape { void draw() override { cout &lt;&lt; "Drawing Rectangle\n"; } };
class Triangle  : public Shape { void draw() override { cout &lt;&lt; "Drawing Triangle\n"; } };

class ShapeFactory {
public:
    static Shape* create(const string&amp; type) {
        if (type == "circle")    return new Circle();
        if (type == "rectangle") return new Rectangle();
        if (type == "triangle")  return new Triangle();
        throw invalid_argument("Unknown shape: " + type);
    }
};

int main() {
    vector&lt;string&gt; order = {"circle","rectangle","triangle","circle"};
    for (auto&amp; t : order) {
        Shape* s = ShapeFactory::create(t);
        s-&gt;draw();
        delete s;
    }
}</div>
                        <div class="out-label">Output</div>
                        <div class="out-block">Drawing Circle
Drawing Rectangle
Drawing Triangle
Drawing Circle</div>
                    </div>
                    <div class="section">
                        <h2>3. Builder — construct complex objects step by step</h2>
                        <p>Used when an object has many optional parts. Avoids telescoping constructors (constructor with 10 parameters).</p>
                        <div class="code-block">class Pizza {
public:
    string size, crust, sauce;
    vector&lt;string&gt; toppings;

    void display() {
        cout &lt;&lt; "Pizza: " &lt;&lt; size &lt;&lt; " | Crust: " &lt;&lt; crust
             &lt;&lt; " | Sauce: " &lt;&lt; sauce &lt;&lt; "\n  Toppings: ";
        for (auto&amp; t : toppings) cout &lt;&lt; t &lt;&lt; " ";
        cout &lt;&lt; "\n";
    }
};

class PizzaBuilder {
    Pizza pizza;
public:
    PizzaBuilder&amp; setSize(string s)    { pizza.size  = s; return *this; }
    PizzaBuilder&amp; setCrust(string c)   { pizza.crust = c; return *this; }
    PizzaBuilder&amp; setSauce(string s)   { pizza.sauce = s; return *this; }
    PizzaBuilder&amp; addTopping(string t) { pizza.toppings.push_back(t); return *this; }
    Pizza build() { return pizza; }
};

int main() {
    Pizza p1 = PizzaBuilder()
        .setSize("Large")
        .setCrust("Thin")
        .setSauce("Tomato")
        .addTopping("Cheese")
        .addTopping("Pepperoni")
        .build();

    Pizza p2 = PizzaBuilder()
        .setSize("Medium")
        .setCrust("Stuffed")
        .setSauce("Pesto")
        .addTopping("Mushroom")
        .build();

    p1.display();
    p2.display();
}</div>

  Toppings: Cheese Pepperoni
Pizza: Medium | Crust: Stuffed | Sauce: Pesto
  Toppings: Mushroom</div>

                    <div class="section">
                        <h2>Interview Q&A</h2>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. Singleton vs static class — which is better and why? <span class="arr">▾</span></div><div class="qa-a">Singleton is better because: (1) It can implement interfaces — allowing you to mock it in tests. A static class cannot implement interfaces. (2) It supports lazy initialization — instance is created only when first needed, not at program startup. (3) It can be subclassed and overridden. (4) It can hold state that has a natural lifetime. Use a static class only for stateless utility functions (like Math.abs). Use Singleton when you need a single instance with state, lifecycle, and potential mockability.</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. What is the difference between Factory and Abstract Factory? <span class="arr">▾</span></div><div class="qa-a">Factory Method: creates ONE product type. A ShapeFactory creates shapes. The factory decides which subclass to instantiate based on input. Abstract Factory: creates a FAMILY of related products. A UIFactory creates Button + TextField + Checkbox that all match the same theme. LightThemeFactory creates LightButton + LightTextField. DarkThemeFactory creates DarkButton + DarkTextField. The key: Abstract Factory guarantees that all created objects are compatible with each other — they belong to the same family. Used when your system needs to work with multiple "product families" interchangeably.</div></div>

                    <div class="section">
                        <h2>What are structural patterns?</h2>
                        <p>Structural patterns deal with <strong>how classes and objects are composed</strong> into larger structures. They make it easier to combine incompatible interfaces, add functionality without subclassing, and simplify complex subsystems.</p>
                    </div>
                    <div class="section">
                        <h2>1. Adapter — bridge incompatible interfaces</h2>
                        <p>Converts one interface into another that a client expects. Like a phone charger adapter that converts a European socket to an Indian socket.</p>
                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

class IndianSocket {
public:
    virtual void provide230V() = 0;
};

class USCharger {
public:
    void provideUSPower() {
        cout &lt;&lt; "[US Charger] Providing 110V power\n";
    }
};

class ChargerAdapter : public IndianSocket {
    USCharger* usCharger;
public:
    ChargerAdapter(USCharger* c) : usCharger(c) {}
    void provide230V() override {
        cout &lt;&lt; "[Adapter] Converting 110V → 230V\n";
        usCharger-&gt;provideUSPower();
        cout &lt;&lt; "[Adapter] Laptop charging at 230V\n";
    }
};

class Laptop {
public:
    void charge(IndianSocket* socket) {
        socket-&gt;provide230V();
    }
};

int main() {
    USCharger usCharger;
    ChargerAdapter adapter(&amp;usCharger);
    Laptop laptop;
    laptop.charge(&amp;adapter);
}</div>

[US Charger] Providing 110V power

                    <div class="section">
                        <h2>2. Decorator — add behaviour dynamically</h2>
                        <p>Adds responsibilities to an object at runtime without subclassing. Stack decorators like layers. Real use: Java I/O streams, middleware, coffee ordering systems.</p>
                        <div class="code-block">class Coffee {
public:
    virtual string getDescription() = 0;
    virtual double getCost() = 0;
    virtual ~Coffee() {}
};

class SimpleCoffee : public Coffee {
public:
    string getDescription() override { return "Simple Coffee"; }
    double getCost()        override { return 30.0; }
};

class CoffeeDecorator : public Coffee {
protected:
    Coffee* coffee;
public:
    CoffeeDecorator(Coffee* c) : coffee(c) {}
};

class MilkDecorator : public CoffeeDecorator {
public:
    MilkDecorator(Coffee* c) : CoffeeDecorator(c) {}
    string getDescription() override {
        return coffee-&gt;getDescription() + " + Milk";
    }
    double getCost() override { return coffee-&gt;getCost() + 10.0; }
};

class SugarDecorator : public CoffeeDecorator {
public:
    SugarDecorator(Coffee* c) : CoffeeDecorator(c) {}
    string getDescription() override {
        return coffee-&gt;getDescription() + " + Sugar";
    }
    double getCost() override { return coffee-&gt;getCost() + 5.0; }
};

class WhipDecorator : public CoffeeDecorator {
public:
    WhipDecorator(Coffee* c) : CoffeeDecorator(c) {}
    string getDescription() override {
        return coffee-&gt;getDescription() + " + Whip";
    }
    double getCost() override { return coffee-&gt;getCost() + 15.0; }
};

int main() {
    Coffee* c = new SimpleCoffee();
    cout &lt;&lt; c-&gt;getDescription() &lt;&lt; " | Rs." &lt;&lt; c-&gt;getCost() &lt;&lt; "\n";

    c = new MilkDecorator(c);
    cout &lt;&lt; c-&gt;getDescription() &lt;&lt; " | Rs." &lt;&lt; c-&gt;getCost() &lt;&lt; "\n";

    c = new SugarDecorator(c);
    cout &lt;&lt; c-&gt;getDescription() &lt;&lt; " | Rs." &lt;&lt; c-&gt;getCost() &lt;&lt; "\n";

    cout &lt;&lt; c-&gt;getDescription() &lt;&lt; " | Rs." &lt;&lt; c-&gt;getCost() &lt;&lt; "\n";
    delete c;
}</div>

Simple Coffee + Milk | Rs.40

                        <h2>3. Facade — simplify complex subsystems</h2>
                        <p>Provides a simple interface to a complex subsystem. Real use: Home theatre system (one button turns on TV, projector, speakers). Online order system hiding payment + inventory + shipping.</p>
                        <div class="code-block">class Inventory  { public: bool check(string item)  { cout &lt;&lt; "[Inventory] Checking: " &lt;&lt; item &lt;&lt; " — OK\n"; return true; } };
class Payment    { public: bool charge(double amt)   { cout &lt;&lt; "[Payment] Charging Rs." &lt;&lt; amt &lt;&lt; " — Success\n"; return true; } };
class Shipping   { public: void ship(string item)    { cout &lt;&lt; "[Shipping] Dispatching: " &lt;&lt; item &lt;&lt; "\n"; } };
class Notification { public: void send(string msg)  { cout &lt;&lt; "[Notify] " &lt;&lt; msg &lt;&lt; "\n"; } };

class OrderFacade {
    Inventory inv; Payment pay; Shipping ship; Notification notify;
public:
    bool placeOrder(string item, double price) {
        cout &lt;&lt; "\n--- Placing order: " &lt;&lt; item &lt;&lt; " ---\n";
        if (!inv.check(item))     return false;
        if (!pay.charge(price))   return false;
        ship.ship(item);
        notify.send("Order confirmed for: " + item);
        return true;
    }
};

int main() {

    facade.placeOrder("Laptop", 65000);
    facade.placeOrder("Mouse",  1500);

[Notify] Order confirmed for: Laptop

--- Placing order: Mouse ---
[Inventory] Checking: Mouse — OK

                    <div class="section">
                        <h2>4. Proxy — controlled access</h2>
                        <p>A proxy controls access to an object — it can add lazy loading, caching, access control, or logging before delegating to the real object.</p>
                        <div class="code-block">class Image {
public:
    virtual void display() = 0;
    virtual ~Image() {}
};

class RealImage : public Image {
    string filename;
public:
    RealImage(string fn) : filename(fn) {
        cout &lt;&lt; "[RealImage] Loading from disk: " &lt;&lt; filename &lt;&lt; "\n";
    }
    void display() override {
        cout &lt;&lt; "[RealImage] Displaying: " &lt;&lt; filename &lt;&lt; "\n";
    }
};

class ProxyImage : public Image {
    string     filename;
    RealImage* real = nullptr;
public:
    ProxyImage(string fn) : filename(fn) {}
    void display() override {
        if (!real) {
            cout &lt;&lt; "[Proxy] First access — loading image...\n";
            real = new RealImage(filename);
        } else {
            cout &lt;&lt; "[Proxy] Serving from cache.\n";
        }
        real-&gt;display();
    }
    ~ProxyImage() { delete real; }
};

int main() {
    Image* img = new ProxyImage("photo.jpg");
    cout &lt;&lt; "Call 1:\n"; img-&gt;display();
    cout &lt;&lt; "Call 2:\n"; img-&gt;display();
    cout &lt;&lt; "Call 3:\n"; img-&gt;display();
    delete img;
}</div>

[Proxy] First access — loading image...
[RealImage] Loading from disk: photo.jpg
[RealImage] Displaying: photo.jpg
Call 2:
[Proxy] Serving from cache.
[RealImage] Displaying: photo.jpg
Call 3:
[Proxy] Serving from cache.
[RealImage] Displaying: photo.jpg</div>

                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the difference between Adapter and Facade? <span class="arr">▾</span></div><div class="qa-a">Adapter changes the interface of ONE existing object to match what a client expects — it wraps a single incompatible object. It's used when you have existing code you cannot modify. Facade creates a new, simpler interface over MULTIPLE existing objects/subsystems — it wraps an entire system. You could have a system with 10 classes and provide a single Facade with 3 easy methods. Key test: Is it about interface conversion (Adapter) or complexity hiding (Facade)?</div></div>

                <p>Defines a family of algorithms, encapsulates each, and makes them interchangeable. Real use: sorting strategies, payment methods, compression algorithms, route planning.</p>
                <div class="code-block">class SortStrategy {
public:
    virtual void sort(vector&lt;int&gt;&amp; data) = 0;
    virtual string name() = 0;
    virtual ~SortStrategy() {}
};

class BubbleSort : public SortStrategy {
public:
    void sort(vector&lt;int&gt;&amp; d) override {
        for (int i = 0; i &lt; d.size()-1; i++)
            for (int j = 0; j &lt; d.size()-i-1; j++)
                if (d[j] &gt; d[j+1]) swap(d[j], d[j+1]);
    }
    string name() override { return "BubbleSort"; }
};

class QuickSort : public SortStrategy {
    void qsort(vector&lt;int&gt;&amp; d, int lo, int hi) {
        if (lo &gt;= hi) return;
        int pivot = d[hi], i = lo-1;
        for (int j = lo; j &lt; hi; j++)
            if (d[j] &lt;= pivot) swap(d[++i], d[j]);
        swap(d[++i], d[hi]);
        qsort(d, lo, i-1); qsort(d, i+1, hi);
    }
public:
    void sort(vector&lt;int&gt;&amp; d) override { qsort(d, 0, d.size()-1); }
    string name() override { return "QuickSort"; }
};

class Sorter {
    SortStrategy* strategy;
public:
    Sorter(SortStrategy* s) : strategy(s) {}
    void setStrategy(SortStrategy* s) { strategy = s; }
    void sortAndPrint(vector&lt;int&gt; data) {
        strategy-&gt;sort(data);
        cout &lt;&lt; "[" &lt;&lt; strategy-&gt;name() &lt;&lt; "] ";
        for (int x : data) cout &lt;&lt; x &lt;&lt; " ";
        cout &lt;&lt; "\n";
    }
};

int main() {
    vector&lt;int&gt; data = {5, 2, 8, 1, 9, 3};
    BubbleSort bs; QuickSort qs;
    Sorter sorter(&amp;bs);

    sorter.sortAndPrint(data);
    sorter.setStrategy(&amp;qs);
    sorter.sortAndPrint(data);
}</div>

                <div class="code-block">class Command {
public:
    virtual void execute() = 0;
    virtual void undo() = 0;
    virtual ~Command() {}
};

class TextEditor {
    string text;
public:
    void addText(string t)    { text += t; }
    void removeText(int n)    { if (n &lt;= text.size()) text = text.substr(0, text.size()-n); }
    void show()               { cout &lt;&lt; "Text: [" &lt;&lt; text &lt;&lt; "]\n"; }
};

class TypeCommand : public Command {
    TextEditor&amp; editor; string typed;
public:
    TypeCommand(TextEditor&amp; e, string t) : editor(e), typed(t) {}
    void execute() override { editor.addText(typed); }
    void undo()    override { editor.removeText(typed.size()); }
};

class CommandManager {
    vector&lt;Command*&gt; history;
public:
    void execute(Command* cmd) {
        cmd-&gt;execute(); history.push_back(cmd);
    }
    void undo() {
        if (!history.empty()) {
            history.back()-&gt;undo();
            history.pop_back();
        }
    }
};

int main() {
    TextEditor editor;
    CommandManager mgr;

    TypeCommand c1(editor, "Hello ");
    TypeCommand c2(editor, "World");
    TypeCommand c3(editor, "!!!");

    mgr.execute(&amp;c1); editor.show();
    mgr.execute(&amp;c2); editor.show();
    mgr.execute(&amp;c3); editor.show();

    cout &lt;&lt; "\n[UNDO]\n";
    mgr.undo(); editor.show();
    cout &lt;&lt; "[UNDO]\n";

                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the difference between Observer and Pub-Sub pattern? <span class="arr">▾</span></div><div class="qa-a">Observer: the subject (publisher) knows its observers directly — it holds references to them and calls their update() directly. Tightly coupled. Both live in the same process. Pub-Sub: a message broker sits between publishers and subscribers. Publishers push to a topic; subscribers register for topics. They never know each other. Loosely coupled, often distributed (Kafka, RabbitMQ, Redis Pub-Sub). Rule: if within one app, Observer. If between services or across a network, Pub-Sub with a message broker.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. Strategy vs State — how are they different? <span class="arr">▾</span></div><div class="qa-a">Both use an interface with interchangeable implementations, but their intent is different. Strategy: the algorithm is selected externally and doesn't change automatically — the client chooses which strategy to use (sort by bubble vs quick). The strategy doesn't know about other strategies. State: the object transitions between states itself based on its internal logic — a VendingMachine in IDLE state transitions to HAS_MONEY when money is inserted. States know about each other and trigger transitions. Strategy = "how to do it". State = "what to do right now based on my current condition".</div></div>

#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;cmath&gt;
using namespace std;

enum class Color { WHITE, BLACK, NONE };

struct Cell {
    int row, col;
    Cell(int r, int c) : row(r), col(c) {}
    bool operator==(const Cell&amp; o) const { return row==o.row &amp;&amp; col==o.col; }
};

class Piece {
protected:
    Color color;
    string symbol;
public:
    Piece(Color c, string s) : color(c), symbol(s) {}
    Color  getColor()  const { return color; }
    string getSymbol() const { return symbol; }
    virtual bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) = 0;
    virtual ~Piece() {}
};

class King : public Piece {
public:
    King(Color c) : Piece(c, c==Color::WHITE ? "K" : "k") {}
    bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) override {
        int dr = abs(to.row - from.row);
        int dc = abs(to.col - from.col);
        return dr &lt;= 1 &amp;&amp; dc &lt;= 1 &amp;&amp; (dr+dc &gt; 0);
    }
};

class Rook : public Piece {
public:
    Rook(Color c) : Piece(c, c==Color::WHITE ? "R" : "r") {}
    bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) override {
        return from.row == to.row || from.col == to.col;
    }
};

class Bishop : public Piece {
public:
    Bishop(Color c) : Piece(c, c==Color::WHITE ? "B" : "b") {}
    bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) override {
        return abs(to.row-from.row) == abs(to.col-from.col);
    }
};

class Queen : public Piece {
public:
    Queen(Color c) : Piece(c, c==Color::WHITE ? "Q" : "q") {}
    bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) override {
        int dr = abs(to.row-from.row), dc = abs(to.col-from.col);
        return from.row==to.row || from.col==to.col || dr==dc;
    }
};

class Knight : public Piece {
public:
    Knight(Color c) : Piece(c, c==Color::WHITE ? "N" : "n") {}
    bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) override {
        int dr = abs(to.row-from.row), dc = abs(to.col-from.col);
        return (dr==2 &amp;&amp; dc==1) || (dr==1 &amp;&amp; dc==2);
    }
};

class Pawn : public Piece {
public:
    Pawn(Color c) : Piece(c, c==Color::WHITE ? "P" : "p") {}
    bool isValidMove(Cell from, Cell to, vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) override {
        int dir = (color == Color::WHITE) ? -1 : 1;
        int dr = to.row - from.row, dc = abs(to.col - from.col);
        if (dc == 0 &amp;&amp; dr == dir)  return true;  // normal move
        if (dc == 0 &amp;&amp; dr == 2*dir &amp;&amp; (from.row==1||from.row==6)) return true; // first move
        if (dc == 1 &amp;&amp; dr == dir &amp;&amp; board[to.row][to.col] != nullptr) return true; // capture
        return false;
    }
};

class Board {

public:
    Board() : grid(8, vector&lt;Piece*&gt;(8, nullptr)) { setup(); }

        grid[7][1]=new Knight(W); grid[7][6]=new Knight(W);
        grid[7][2]=new Bishop(W); grid[7][5]=new Bishop(W);
        grid[7][3]=new Queen(W);  grid[7][4]=new King(W);
        for (int c=0;c&lt;8;c++) grid[6][c]=new Pawn(W);

        grid[0][0]=new Rook(B);   grid[0][7]=new Rook(B);
        grid[0][1]=new Knight(B); grid[0][6]=new Knight(B);
        grid[0][2]=new Bishop(B); grid[0][5]=new Bishop(B);
        grid[0][3]=new Queen(B);  grid[0][4]=new King(B);
        for (int c=0;c&lt;8;c++) grid[1][c]=new Pawn(B);
    }

    bool movePiece(Cell from, Cell to) {
        Piece* p = grid[from.row][from.col];
        if (!p) { cout &lt;&lt; "[ERR] No piece at source.\n"; return false; }

        if (!p-&gt;isValidMove(from, to, grid)) {
            cout &lt;&lt; "[INVALID] " &lt;&lt; p-&gt;getSymbol()
                 &lt;&lt; " cannot move to (" &lt;&lt; to.row &lt;&lt; "," &lt;&lt; to.col &lt;&lt; ")\n";
            return false;
        }
        Piece* target = grid[to.row][to.col];
        if (target &amp;&amp; target-&gt;getColor() == p-&gt;getColor()) {
            cout &lt;&lt; "[INVALID] Cannot capture own piece.\n"; return false;
        }
        string capture = "";
        if (target) { capture = " [captures " + target-&gt;getSymbol() + "]"; delete target; }

        grid[to.row][to.col]   = p;
        grid[from.row][from.col] = nullptr;

        cout &lt;&lt; "[MOVE] " &lt;&lt; p-&gt;getSymbol()
             &lt;&lt; " (" &lt;&lt; from.row &lt;&lt; "," &lt;&lt; from.col &lt;&lt; ")"
             &lt;&lt; " → (" &lt;&lt; to.row &lt;&lt; "," &lt;&lt; to.col &lt;&lt; ")"
             &lt;&lt; capture &lt;&lt; "\n";
        return true;
    }

    void display() {
        cout &lt;&lt; "\n  0 1 2 3 4 5 6 7\n";

            }
            cout &lt;&lt; "\n";
        }
        cout &lt;&lt; "\n";
    }
};

class Game {

                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. How would you add check and checkmate detection? <span class="arr">▾</span></div><div class="qa-a">After every move, scan all opponent pieces and check if any can attack the current player's King cell using isValidMove(). If yes — it's "check". For checkmate: try every possible move of every piece of the checked player. If no move results in a position where the King is no longer under attack — it's checkmate. This is expensive (O(pieces * board_size)) but chess boards are small (8x8) so it's acceptable. Optimisation: track the King's position explicitly so you don't scan the whole board to find it.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. What design pattern is used here and why is it better than a giant if-else? <span class="arr">▾</span></div><div class="qa-a">Template Method / Polymorphism via inheritance. Each Piece subclass implements isValidMove() according to its own rules. Without this, you'd have: if (piece == "King") { ... } else if (piece == "Queen") { ... } in one giant method. Problems: violates SRP (one method knows all rules), violates OCP (adding a new piece requires editing this method), harder to test each rule in isolation. With the pattern: adding a new piece (e.g., Fairy Chess Archbishop) just means adding a new subclass — zero changes to existing code.</div></div>

class OrderObserver {
public:
    virtual void onStatusChange(int orderId, OrderStatus status) = 0;
    virtual ~OrderObserver() {}
};

public:
    Order(int custId, int restId, const Cart&amp; cart)

    int    getId()     const { return orderId; }
    OrderStatus getStatus() const { return status; }

    void subscribe(OrderObserver* o) { observers.push_back(o); }

    void updateStatus(OrderStatus s) {

            <div class="section">
                <h2>What is scalability?</h2>
                <p>Scalability is the ability of a system to handle growing load — more users, more data, more requests — without degrading performance. It's the first HLD concept interviewers probe.</p>
                <div class="hl">If your system works for 100 users but falls over with 10 million — it doesn't scale. Every HLD answer must explain how the system handles 10x, 100x growth.</div>
            </div>
            <div class="section">
                <h2>Vertical vs horizontal scaling</h2>
                <div class="card-row">
                    <div class="card"><div class="lbl">Vertical (scale up)</div><div class="val">Bigger single machine</div><div class="sub">More RAM, faster CPU, better SSD. Simple but has a hard ceiling — biggest machine costs millions and still fails.</div></div>
                    <div class="card"><div class="lbl">Horizontal (scale out)</div><div class="val">More machines</div><div class="sub">Add commodity servers. No theoretical limit. Used by Google, Netflix, Amazon. Requires stateless design.</div></div>
                </div>
                <div class="ok">Rule: Start vertical (simpler). Move horizontal when you hit limits. Design stateless services from day one to make horizontal scaling easy.</div>
            </div>
            <div class="section">
                <h2>Load balancer</h2>
                <p>A load balancer distributes incoming requests across multiple server instances so no single server is overwhelmed.</p>
                <div class="code-block">// Simulating load balancer strategies in C++
#include &lt;iostream&gt;
#include &lt;vector&gt;
using namespace std;

struct Server {
    string name;
    int    activeConnections;
    bool   isHealthy;
    Server(string n) : name(n), activeConnections(0), isHealthy(true) {}
};

class LoadBalancer {
    vector&lt;Server&gt; servers;
    int roundRobinIdx = 0;
public:
    void addServer(Server s) { servers.push_back(s); }

    // Strategy 1: Round Robin
    Server* getRoundRobin() {
        int start = roundRobinIdx;
        do {
            Server&amp; s = servers[roundRobinIdx];
            roundRobinIdx = (roundRobinIdx + 1) % servers.size();
            if (s.isHealthy) return &amp;s;
        } while (roundRobinIdx != start);
        return nullptr;
    }

    // Strategy 2: Least Connections
    Server* getLeastConnections() {
        Server* best = nullptr;
        for (auto&amp; s : servers) {
            if (!s.isHealthy) continue;
            if (!best || s.activeConnections &lt; best-&gt;activeConnections)
                best = &amp;s;
        }
        return best;
    }

    void handleRequest(string strategy) {
        Server* s = (strategy == "rr") ? getRoundRobin() : getLeastConnections();
        if (s) {
            s-&gt;activeConnections++;
            cout &lt;&lt; "[" &lt;&lt; strategy &lt;&lt; "] → " &lt;&lt; s-&gt;name
                 &lt;&lt; " (conns: " &lt;&lt; s-&gt;activeConnections &lt;&lt; ")\n";
        } else {
            cout &lt;&lt; "[ERR] No healthy servers!\n";
        }
    }
    void markDown(string name) {
        for (auto&amp; s : servers)
            if (s.name == name) { s.isHealthy = false; cout &lt;&lt; "[DOWN] " &lt;&lt; name &lt;&lt; "\n"; }
    }
};

int main() {
    LoadBalancer lb;
    lb.addServer(Server("Server-A"));
    lb.addServer(Server("Server-B"));
    lb.addServer(Server("Server-C"));

    cout &lt;&lt; "--- Round Robin ---\n";
    for (int i = 0; i &lt; 6; i++) lb.handleRequest("rr");

    lb.markDown("Server-B");
    cout &lt;&lt; "\n--- Round Robin after Server-B down ---\n";
    for (int i = 0; i &lt; 4; i++) lb.handleRequest("rr");

    cout &lt;&lt; "\n--- Least Connections ---\n";
    LoadBalancer lb2;
    lb2.addServer(Server("S1")); lb2.addServer(Server("S2")); lb2.addServer(Server("S3"));
    for (int i = 0; i &lt; 5; i++) lb2.handleRequest("lc");
}</div>

                <h2>Stateless design — key to horizontal scaling</h2>
                <p>For horizontal scaling to work, servers must be stateless — any server can handle any request. Session state must live in a shared store (Redis), not in server memory.</p>
                <div class="table-wrap"><table>

                    <tr><td>Session stored in Server A's RAM</td><td>Session stored in Redis (shared)</td></tr>
                    <tr><td>User must always hit Server A</td><td>Any server can serve the user</td></tr>

                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the difference between load balancing and reverse proxy? <span class="arr">▾</span></div><div class="qa-a">A reverse proxy sits in front of servers and handles requests on their behalf — it can do SSL termination, compression, caching, and routing to ONE backend. A load balancer distributes traffic across MULTIPLE backend instances. In practice, tools like Nginx and HAProxy serve as both — they act as reverse proxies AND distribute load across a pool of servers. Conceptually: reverse proxy = front-end intermediary. Load balancer = traffic distributor. Most production systems use both, often combined in one layer (Nginx → multiple app servers).</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. How does a load balancer detect that a server is unhealthy? <span class="arr">▾</span></div><div class="qa-a">Health checks — the load balancer periodically sends a request to each server's health endpoint (e.g., GET /health). If the server returns 200 OK within a timeout, it's healthy. If it fails N consecutive times, the load balancer marks it down and stops sending traffic. Types: (1) Passive — detects failures from actual request failures. (2) Active — sends periodic heartbeat probes. Production load balancers (AWS ALB, Nginx, HAProxy) use active health checks with configurable intervals, thresholds, and timeout values. When the server recovers, it's gradually re-added (circuit breaker pattern).</div></div>

                <h2>Why caching?</h2>
                <p>A database query might take 50–200ms. A cache hit takes under 1ms. For a system handling 100,000 requests/second, caching is what makes the difference between "fast" and "down".</p>

                <h2>Cache strategies</h2>
                <div class="table-wrap"><table>
                    <tr><th>Strategy</th><th>How it works</th><th>Best for</th></tr>
                    <tr><td><span class="tag blue">Cache-aside</span></td><td>App checks cache first. On miss: read from DB, write to cache. App manages cache explicitly.</td><td>Read-heavy, cache data independently</td></tr>
                    <tr><td><span class="tag green">Write-through</span></td><td>Every write goes to cache AND DB simultaneously. Always consistent.</td><td>Write + read, consistency critical</td></tr>
                    <tr><td><span class="tag amber">Write-back</span></td><td>Write to cache only. Write to DB asynchronously later. Fastest writes but risk data loss on crash.</td><td>Write-heavy, tolerate slight inconsistency</td></tr>
                    <tr><td><span class="tag purple">Read-through</span></td><td>Cache sits in front of DB. On miss: cache itself loads from DB. App only talks to cache.</td><td>Simplified app code, consistent pattern</td></tr>
                </table></div>

            <div class="section">
                <h2>LRU Cache — implement from scratch</h2>
                <p>LRU (Least Recently Used) evicts the item not accessed for the longest time. Classic interview question. Uses hashmap + doubly linked list for O(1) get and put.</p>
                <div class="code-block">#include &lt;iostream&gt;
#include &lt;unordered_map&gt;
#include &lt;list&gt;
using namespace std;

class LRUCache {
    int capacity;
    list&lt;pair&lt;int,int&gt;&gt; lru; // {key, value} — front = most recent
    unordered_map&lt;int, list&lt;pair&lt;int,int&gt;&gt;::iterator&gt; mp;
public:
    LRUCache(int cap) : capacity(cap) {
        cout &lt;&lt; "[Cache] Initialized with capacity: " &lt;&lt; cap &lt;&lt; "\n";
    }

    int get(int key) {
        if (!mp.count(key)) {
            cout &lt;&lt; "[MISS] key=" &lt;&lt; key &lt;&lt; "\n";
            return -1;
        }
        // Move to front (most recently used)
        lru.splice(lru.begin(), lru, mp[key]);
        cout &lt;&lt; "[HIT]  key=" &lt;&lt; key &lt;&lt; " → val=" &lt;&lt; mp[key]-&gt;second &lt;&lt; "\n";
        return mp[key]-&gt;second;
    }

    void put(int key, int value) {
        if (mp.count(key)) {
            mp[key]-&gt;second = value;
            lru.splice(lru.begin(), lru, mp[key]);
            cout &lt;&lt; "[UPDATE] key=" &lt;&lt; key &lt;&lt; " val=" &lt;&lt; value &lt;&lt; "\n";
            return;
        }
        if (lru.size() == capacity) {
            int evicted = lru.back().first;
            mp.erase(evicted);
            lru.pop_back();
            cout &lt;&lt; "[EVICT] key=" &lt;&lt; evicted &lt;&lt; "\n";
        }
        lru.push_front({key, value});
        mp[key] = lru.begin();
        cout &lt;&lt; "[PUT]   key=" &lt;&lt; key &lt;&lt; " val=" &lt;&lt; value &lt;&lt; "\n";
    }

    void display() {
        cout &lt;&lt; "[Cache state, LRU→MRU]: ";
        for (auto it = lru.rbegin(); it != lru.rend(); it++)
            cout &lt;&lt; it-&gt;first &lt;&lt; ":" &lt;&lt; it-&gt;second &lt;&lt; " ";
        cout &lt;&lt; "\n";
    }
};

int main() {
    LRUCache cache(3);
    cache.put(1, 100);
    cache.put(2, 200);
    cache.put(3, 300);
    cache.display();

    cache.get(1);       // hit, 1 becomes MRU
    cache.put(4, 400);  // evicts 2 (LRU)
    cache.display();

    cache.get(2);       // miss
    cache.get(3);       // hit
    cache.put(5, 500);  // evicts 4 (LRU)
    cache.display();
}</div>

                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is a cache stampede and how do you prevent it? <span class="arr">▾</span></div><div class="qa-a">Cache stampede (thundering herd): a popular cache key expires. Simultaneously, hundreds of requests miss the cache and all rush to the database at once. The DB gets hammered. Prevention: (1) Mutex locking — only one request fetches from DB, the rest wait. (2) Cache warming — pre-populate the cache before expiry using background jobs. (3) Probabilistic early expiry — randomly expire the cache slightly before TTL for a small % of requests, so the cache is refreshed without a full stampede. (4) Stale-while-revalidate — serve the stale value immediately, refresh in the background.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. LRU vs LFU — which eviction policy should you choose? <span class="arr">▾</span></div><div class="qa-a">LRU (Least Recently Used): evicts items not accessed for the longest time. Good when recency predicts future access — e.g., user sessions, news feed. Weakness: a one-time scan of all items pollutes the cache. LFU (Least Frequently Used): evicts items accessed the least number of times. Good when frequency predicts importance — e.g., popular products, trending searches. Weakness: newly added items start with frequency 1 and may be evicted before getting a chance. In practice: Redis uses a modified LRU by default; most CDNs use LRU; databases use LFU-variants. For mixed access patterns, LRU is the safe default.</div></div>

                    <div class="card"><div class="lbl">Consumer</div><div class="val">Processes messages</div><div class="sub">Email service, notification service, analytics service</div></div>

                <div class="code-block">#include &lt;iostream&gt;
#include &lt;queue&gt;
#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;functional&gt;
using namespace std;

struct Message {
    int    id;
    string topic;
    string payload;
    Message(int i, string t, string p) : id(i), topic(t), payload(p) {}
};

class MessageQueue {
    queue&lt;Message&gt; q;
    int msgCounter = 0;
    string name;
public:
    MessageQueue(string n) : name(n) {}

    void publish(string topic, string payload) {
        q.push(Message(++msgCounter, topic, payload));
        cout &lt;&lt; "[Queue:" &lt;&lt; name &lt;&lt; "] Published #" &lt;&lt; msgCounter
             &lt;&lt; " topic=" &lt;&lt; topic &lt;&lt; " | " &lt;&lt; payload &lt;&lt; "\n";
    }
    bool consume(function&lt;void(Message&amp;)&gt; handler) {
        if (q.empty()) return false;
        Message msg = q.front(); q.pop();
        cout &lt;&lt; "[Queue:" &lt;&lt; name &lt;&lt; "] Consuming #" &lt;&lt; msg.id &lt;&lt; "\n";
        handler(msg);
        return true;
    }
    int size() const { return q.size(); }
    bool empty() const { return q.empty(); }
};

class OrderService {
    MessageQueue&amp; queue;
public:
    OrderService(MessageQueue&amp; q) : queue(q) {}
    void placeOrder(int userId, string item, double price) {
        cout &lt;&lt; "\n[OrderService] Order placed: " &lt;&lt; item &lt;&lt; " by user " &lt;&lt; userId &lt;&lt; "\n";
        string payload = "{userId:" + to_string(userId) +
                         ",item:\"" + item +
                         "\",price:" + to_string((int)price) + "}";
        queue.publish("order.placed", payload);
        cout &lt;&lt; "[OrderService] Returned 200 OK to client immediately.\n";
    }
};

class EmailService {
public:
    void handle(Message&amp; msg) {
        cout &lt;&lt; "  [EmailService] Sending confirmation email → " &lt;&lt; msg.payload &lt;&lt; "\n";
    }
};
class InventoryService {
public:
    void handle(Message&amp; msg) {
        cout &lt;&lt; "  [InventoryService] Deducting stock → " &lt;&lt; msg.payload &lt;&lt; "\n";
    }
};
class AnalyticsService {
public:
    void handle(Message&amp; msg) {
        cout &lt;&lt; "  [Analytics] Recording event → " &lt;&lt; msg.payload &lt;&lt; "\n";
    }
};

int main() {
    MessageQueue orderQueue("orders");
    OrderService  orders(orderQueue);
    EmailService  emailSvc;
    InventoryService invSvc;
    AnalyticsService analyticsSvc;

    orders.placeOrder(1, "Laptop", 65000);
    orders.placeOrder(2, "Mouse",  1500);
    orders.placeOrder(3, "Keyboard", 3000);

    cout &lt;&lt; "\n--- Consumers processing " &lt;&lt; orderQueue.size() &lt;&lt; " messages ---\n";

    while (!orderQueue.empty()) {
        orderQueue.consume([&amp;](Message&amp; msg) {
            emailSvc.handle(msg);
            invSvc.handle(msg);
            analyticsSvc.handle(msg);
        });
    }
    cout &lt;&lt; "\n[Queue empty — all messages processed]\n";

                <h2>Kafka vs RabbitMQ</h2>
                <div class="table-wrap"><table>
                    <tr><th></th><th>Kafka</th><th>RabbitMQ</th></tr>
                    <tr><td>Model</td><td>Distributed log — messages retained</td><td>Queue — messages consumed and gone</td></tr>
                    <tr><td>Throughput</td><td>Millions of msgs/sec</td><td>Thousands of msgs/sec</td></tr>
                    <tr><td>Consumer</td><td>Pull-based, consumer tracks offset</td><td>Push-based, broker tracks state</td></tr>
                    <tr><td>Replay</td><td>Yes — replay from any offset</td><td>No — consumed = deleted</td></tr>
                    <tr><td>Use case</td><td>Event streaming, audit log, analytics</td><td>Task queues, RPC, work distribution</td></tr>
                    <tr><td>Used by</td><td>LinkedIn, Netflix, Uber, Grab</td><td>Instagram, Reddit, smaller apps</td></tr>
                </table></div>
            </div>
            <div class="section">
                <h2>Interview Q&A</h2>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What happens if a consumer fails mid-processing? <span class="arr">▾</span></div><div class="qa-a">With acknowledgements (ACK): the message stays in the queue until the consumer sends an ACK after successful processing. If the consumer crashes before ACKing, the broker re-queues the message for another consumer. This gives at-least-once delivery. Risk: the same message might be processed twice (if consumer processed but crashed before ACKing). Solution: make consumers idempotent — processing the same message twice produces the same result. Example: use a processed_message_ids table in DB to skip already-handled messages.</div></div>
                <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. What is the difference between a queue and a topic (pub-sub)? <span class="arr">▾</span></div><div class="qa-a">Queue: one message is delivered to exactly ONE consumer. Work is distributed — if 3 consumers are listening, each message goes to one of them. Used for load-balanced task processing (3 workers processing orders). Topic (pub-sub): one message is delivered to ALL subscribers. Every service that subscribed gets a copy. Used for event notification (order.placed event → email service, inventory service, analytics service all get it). Kafka uses topics with consumer groups: within a consumer group, each message goes to one consumer (queue behaviour); across groups, all groups get all messages (pub-sub behaviour).</div></div>
            </div>

topics.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.textContent=t.label;

    btn.onclick=()=>{

    page.className='page'+(i===0?' active':'');

    page.innerHTML=t.html;
    pages.appendChild(page);
});

function tog(el){
    const ans=el.nextElementSibling;
    const arr=el.querySelector('.arr');
    const isOpen=ans.classList.contains('open');

    // Close any currently open QAs within this specific page tab
    const currentPage = el.closest('.page');
    currentPage.querySelectorAll('.qa-a.open').forEach(openA => {
        openA.classList.remove('open');
        openA.previousElementSibling.querySelector('.arr').classList.remove('open');
    });

    if(!isOpen) {
        ans.classList.add('open');
        arr.classList.add('open');
    }
}
