                id: 't1', label: 'LLD vs HLD', html: `
                    <div class="sec">
                        <h2>What is system design?</h2>
                        <p>System design is the process of defining the <strong>architecture, components, and data flow</strong> of a software system to meet given requirements. Every large product (Amazon, WhatsApp, Uber) was designed before a single line of code was written.</p>
                        <div class="highlight">Real analogy: Building a hospital. HLD = deciding how many buildings, departments, floors, power supply. LLD = designing each room — bed count, wiring, plumbing details.</div>
                    </div>
                    <div class="sec">
                        <h2>LLD vs HLD — the core split</h2>
                        <div class="card-row">
                            <div class="card"><div class="lbl">LLD — Low Level Design</div><div class="val">How to code it</div><div class="sub">Classes, objects, methods, design patterns, DB schema. Answers: "how will each component work internally?"</div></div>
                            <div class="card"><div class="lbl">HLD — High Level Design</div><div class="val">How to architect it</div><div class="sub">Servers, load balancers, databases, queues, CDN. Answers: "how do all components connect at scale?"</div></div>
                        </div>
                        <div style="overflow-x:auto;margin:10px 0"><table class="tw-table">
                            <tr><th>Aspect</th><th>LLD</th><th>HLD</th></tr>
                            <tr><td>Focus</td><td>Code-level structure</td><td>Infrastructure & components</td></tr>
                            <tr><td>Tools</td><td>Class diagrams, UML, design patterns</td><td>Architecture diagrams, capacity estimates</td></tr>
                            <tr><td>Asked in</td><td>Mid-level / SDE-1 interviews</td><td>Senior / SDE-2+ interviews</td></tr>
                            <tr><td>Output</td><td>C++/Java/Python classes with code</td><td>System diagram + trade-off discussion</td></tr>
                            <tr><td>Example</td><td>Design a Parking Lot class hierarchy</td><td>Design Instagram's photo storage at scale</td></tr>
                        </table></div>
                    </div>
                    <div class="sec">
                        <h2>The design interview framework (use for every problem)</h2>
                        <div class="step"><div class="step-h"><div class="step-n">1</div><div class="step-t">Clarify requirements — functional & non-functional</div></div><div class="step-b">Functional: what should the system DO? (book a ticket, send a message). Non-functional: how many users? what latency? availability requirement? This step alone separates strong candidates.</div></div>
                        <div class="step"><div class="step-h"><div class="step-n">2</div><div class="step-t">Estimate capacity (for HLD) / Identify entities (for LLD)</div></div><div class="step-b">HLD: estimate QPS, storage, bandwidth. LLD: identify classes, relationships, and responsibilities first.</div></div>
                        <div class="step"><div class="step-h"><div class="step-n">3</div><div class="step-t">Design core components — draw / write skeleton</div></div><div class="step-b">LLD: sketch class diagram, write class headers with methods. HLD: draw boxes for each service, database, cache, queue.</div></div>
                        <div class="step"><div class="step-h"><div class="step-n">4</div><div class="step-t">Deep dive — fill in details</div></div><div class="step-b">LLD: implement critical classes with code. HLD: discuss DB choice, sharding strategy, failure scenarios.</div></div>
                        <div class="step"><div class="step-h"><div class="step-n">5</div><div class="step-t">Discuss trade-offs — show you know there's no perfect answer</div></div><div class="step-b">Consistency vs availability, SQL vs NoSQL, monolith vs microservices. The best candidates proactively raise trade-offs.</div></div>
                    </div>
                    <div class="sec">
                        <h2>Interview Q&A</h2>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What is the difference between LLD and HLD? Which is asked where? <span class="arrow">▾</span></div><div class="qa-a">LLD (Low Level Design) focuses on the internal structure of components — class design, design patterns, code. Asked at SDE-1/SDE-2 for OOPs and coding ability. HLD (High Level Design) focuses on the overall architecture — servers, databases, queues, scaling strategies. Asked at SDE-2+ and senior levels. Most modern interviews combine both: start with HLD architecture, then drill into one component with LLD class design. Always clarify which level the interviewer wants before starting.</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. How do you start a system design interview? <span class="arrow">▾</span></div><div class="qa-a">Never jump straight to design. First spend 3-5 minutes: (1) Ask about scale — how many users, requests per second? (2) Clarify core features — what must work vs what's optional? (3) State your assumptions out loud — "I'll assume ~1M DAU, 99.9% uptime required." (4) Then sketch the big picture. Interviewers grade heavily on this structured approach — jumping to "we need Kafka and Redis" without requirements is a red flag.</div></div>
                    </div>

                id: 't2', label: 'SOLID Principles', html: `
                    <div class="sec">
                        <h2>Why SOLID?</h2>
                        <p>SOLID is 5 principles that make code easy to extend, maintain, and test. Every LLD interview question tests these implicitly. Violating SOLID leads to code that breaks when requirements change.</p>
                    </div>
                    <div class="sec">
                        <h2>S — Single Responsibility Principle</h2>
                        <p><strong>A class should have only one reason to change.</strong> One class = one job.</p>
                        <div class="danger">Bad design: <code>Employee</code> class handles payroll calculation, saving to DB, AND sending email — three reasons to change.</div>
                        <div class="cb"><span class="cb-label">C++ — bad</span>class Employee {
public:
    string name;
    double salary;

    double calculatePay() { return salary * 1.2; }   // payroll logic
    void saveToDatabase()  { /* DB code */ }         // DB concern
    void sendEmail()       { /* email code */ }      // notification
};</div>
                        <div class="cb"><span class="cb-label">C++ — good (SRP applied)</span>#include &lt;iostream&gt;
using namespace std;

class Employee {
public:
    string name;
    double salary;
    Employee(string n, double s) : name(n), salary(s) {}
};

class PayrollCalculator {
public:
    double calculate(Employee& e) { return e.salary * 1.2; }
};

class EmployeeRepository {
public:
    void save(Employee& e) {
        cout &lt;&lt; "Saving " &lt;&lt; e.name &lt;&lt; " to DB\n";
    }
};

class EmailService {
public:
    void sendPayslip(Employee& e) {
        cout &lt;&lt; "Email sent to " &lt;&lt; e.name &lt;&lt; "\n";
    }
};

int main() {
    Employee emp("Rahul", 50000);
    PayrollCalculator pc;
    EmployeeRepository repo;
    EmailService email;

    double pay = pc.calculate(emp);
    cout &lt;&lt; "Pay: " &lt;&lt; pay &lt;&lt; "\n";
    repo.save(emp);
    email.sendPayslip(emp);
}</div>
                        <div class="out">Pay: 60000
Saving Rahul to DB
Email sent to Rahul</div>
                    </div>
                    <div class="sec">
                        <h2>O — Open/Closed Principle</h2>
                        <p><strong>Open for extension, closed for modification.</strong> Add new features by adding new classes, not editing existing ones.</p>
                        <div class="cb"><span class="cb-label">C++ — OCP with shape area</span>#include &lt;iostream&gt;
#include &lt;cmath&gt;
using namespace std;

class Shape {
public:
    virtual double area() = 0;
    virtual ~Shape() {}
};

class Circle : public Shape {
    double r;
public:
    Circle(double r) : r(r) {}
    double area() override { return 3.14 * r * r; }
};

class Rectangle : public Shape {
    double w, h;
public:
    Rectangle(double w, double h) : w(w), h(h) {}
    double area() override { return w * h; }
};

// Adding Triangle needs NO change to existing classes
class Triangle : public Shape {
    double b, h;
public:
    Triangle(double b, double h) : b(b), h(h) {}
    double area() override { return 0.5 * b * h; }
};

int main() {
    Shape* shapes[] = { new Circle(5), new Rectangle(4,6), new Triangle(3,8) };
    for (auto s : shapes)
        cout &lt;&lt; "Area: " &lt;&lt; s-&gt;area() &lt;&lt; "\n";
}</div>
                        <div class="out">Area: 78.5
Area: 24
Area: 12</div>
                    </div>
                    <div class="sec">
                        <h2>L — Liskov Substitution Principle</h2>
                        <p><strong>A child class must be substitutable for its parent without breaking the program.</strong></p>
                        <div class="cb"><span class="cb-label">C++ — LSP example</span>#include &lt;iostream&gt;
using namespace std;

class Bird {
public:
    virtual void fly() { cout &lt;&lt; "Flying!\n"; }
};

class Sparrow : public Bird {
public:
    void fly() override { cout &lt;&lt; "Sparrow flying!\n"; }
};

// LSP violation: Penguin IS-A Bird but can't fly
// Fix: redesign the hierarchy

class FlyingBird : public Bird {};
class NonFlyingBird {};

class Penguin : public NonFlyingBird {
public:
    void swim() { cout &lt;&lt; "Penguin swimming!\n"; }
};

void makeFly(Bird* b) { b-&gt;fly(); }

int main() {
    Sparrow s;
    makeFly(&amp;s);     // works fine
    Penguin p;
    p.swim();        // no fly() forced on penguin
}</div>
                        <div class="out">Sparrow flying!
Penguin swimming!</div>
                    </div>
                    <div class="sec">
                        <h2>I — Interface Segregation Principle</h2>
                        <p><strong>Don't force a class to implement methods it doesn't need.</strong> Split fat interfaces into smaller focused ones.</p>
                        <div class="cb"><span class="cb-label">C++ — ISP</span>#include &lt;iostream&gt;
using namespace std;

// Fat interface (bad) — forces all devices to implement all methods
// class Device { virtual void print()=0; virtual void scan()=0; virtual void fax()=0; };

// ISP: split into focused interfaces
class Printer    { public: virtual void print() = 0; };
class Scanner    { public: virtual void scan()  = 0; };
class FaxMachine { public: virtual void fax()   = 0; };

class OfficePrinter : public Printer, public Scanner {
public:
    void print() override { cout &lt;&lt; "Printing...\n"; }
    void scan()  override { cout &lt;&lt; "Scanning...\n"; }
    // Not forced to implement fax()
};

int main() {

    op.print();
    op.scan();

                        <div class="out">Printing...
Scanning...</div>
                    </div>
                    <div class="sec">
                        <h2>D — Dependency Inversion Principle</h2>
                        <p><strong>Depend on abstractions, not concrete implementations.</strong> High-level modules should not depend on low-level modules.</p>
                        <div class="cb"><span class="cb-label">C++ — DIP</span>#include &lt;iostream&gt;
using namespace std;

// Abstraction (interface)
class MessageSender {
public:
    virtual void send(string msg) = 0;
    virtual ~MessageSender() {}
};

// Low-level implementations
class EmailSender : public MessageSender {
public:
    void send(string msg) override {
        cout &lt;&lt; "Email: " &lt;&lt; msg &lt;&lt; "\n";
    }
};

class SMSSender : public MessageSender {
public:
    void send(string msg) override {
        cout &lt;&lt; "SMS: " &lt;&lt; msg &lt;&lt; "\n";
    }
};

// High-level module depends on abstraction, not concrete class
class Notification {
    MessageSender* sender;
public:
    Notification(MessageSender* s) : sender(s) {}
    void notify(string msg) { sender-&gt;send(msg); }
};

int main() {
    EmailSender email;
    SMSSender   sms;

    Notification n1(&amp;email);
    Notification n2(&amp;sms);

    n1.notify("Your order is shipped!");
    n2.notify("OTP: 482910");
}</div>
                        <div class="out">Email: Your order is shipped!
SMS: OTP: 482910</div>
                        <div class="remember"><strong>One-line memory trick:</strong> SRP=one job, OCP=extend don't modify, LSP=safe substitution, ISP=small interfaces, DIP=depend on abstractions.</div>
                    </div>
                    <div class="sec">
                        <h2>Interview Q&A</h2>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. Which SOLID principle does this violate: a User class that has login(), saveToDB(), and sendWelcomeEmail()? <span class="arrow">▾</span></div><div class="qa-a">Single Responsibility Principle (SRP). The User class has 3 responsibilities: authentication (login), persistence (saveToDatabase), and notification (sendEmail). If the email provider changes, you must edit User class — that's a second reason to change. Fix: AuthService handles login, UserRepository handles DB, EmailService handles email. Each has exactly one reason to change.</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. How does DIP improve testability? <span class="arrow">▾</span></div><div class="qa-a">When high-level modules depend on abstractions (interfaces), you can inject a mock implementation during testing. Example: Notification depends on MessageSender interface. In production inject EmailSender. In tests inject MockSender that just records calls. Without DIP, you'd need a real email server running just to test Notification — impossible in unit tests. DIP + constructor injection is the foundation of dependency injection frameworks (Spring in Java, etc.).</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q3. What is the difference between OCP and LSP? <span class="arrow">▾</span></div><div class="qa-a">OCP is about the class itself — you should be able to add new behavior by adding new subclasses or extensions without modifying existing code. LSP is about subclass correctness — a subclass must behave correctly wherever the parent is expected. OCP says "add via extension." LSP says "extended classes must be safe substitutes." They work together: OCP encourages inheritance and extension; LSP ensures that extension doesn't break existing code that uses the parent type.</div></div>
                    </div>

                    <div class="sec">
                        <h2>Why UML in system design?</h2>
                        <p>UML (Unified Modeling Language) diagrams are the <strong>blueprint language</strong> of system design. Before writing code, you draw UML to communicate your design. Interviewers use them to evaluate your thinking process.</p>

                        <div class="cb"><span class="cb-label">C++ — relationships</span>#include &lt;iostream&gt;
#include &lt;vector&gt;

// INHERITANCE (IS-A): Car IS-A Vehicle
class Vehicle {
public:

};

                    <div class="sec">
                        <h2>Problem statement</h2>
                        <p>Design a parking lot system. Support multiple floors, different vehicle types (car, bike, truck), display available spots, and handle entry/exit with ticket generation.</p>
                        <div class="highlight"><strong>Requirements:</strong> Multiple floors → Multiple rows per floor → Multiple spots per row. Vehicle types have different spot sizes. Entry: generate ticket. Exit: calculate fee.</div>
                    </div>
                    <div class="sec">
                        <h2>Step 1 — identify entities (classes)</h2>
                        <div class="card-row">
                            <div class="card"><div class="lbl">Core entities</div><div class="val">ParkingLot, Floor, ParkingSpot</div><div class="sub">The physical structure</div></div>
                            <div class="card"><div class="lbl">Vehicles</div><div class="val">Vehicle, Car, Bike, Truck</div><div class="sub">What gets parked</div></div>
                            <div class="card"><div class="lbl">Operations</div><div class="val">Ticket, Payment, EntryGate</div><div class="sub">What happens at entry/exit</div></div>
                        </div>
                    </div>
                    <div class="sec">
                        <h2>Step 2 — class diagram (as code)</h2>
                        <div class="cb"><span class="cb-label">C++ — Parking Lot LLD</span>#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;ctime&gt;
using namespace std;

// ── Enums ────────────────────────────────────────────
enum VehicleType { BIKE, CAR, TRUCK };
enum SpotType    { SMALL, MEDIUM, LARGE };
enum SpotStatus  { AVAILABLE, OCCUPIED };

// ── Vehicle hierarchy ────────────────────────────────
class Vehicle {
public:
    string licensePlate;
    VehicleType type;
    Vehicle(string plate, VehicleType t) : licensePlate(plate), type(t) {}
};
class Car   : public Vehicle { public: Car(string p)   : Vehicle(p, CAR)   {} };
class Bike  : public Vehicle { public: Bike(string p)  : Vehicle(p, BIKE)  {} };
class Truck : public Vehicle { public: Truck(string p) : Vehicle(p, TRUCK) {} };

// ── Parking Spot ─────────────────────────────────────
class ParkingSpot {
public:
    int spotId;
    SpotType  type;
    SpotStatus status;
    Vehicle* parkedVehicle;

    ParkingSpot(int id, SpotType t)
        : spotId(id), type(t), status(AVAILABLE), parkedVehicle(nullptr) {}

    bool isAvailable() { return status == AVAILABLE; }

    bool canFit(VehicleType vt) {
        if (vt == BIKE  &amp;&amp; type == SMALL)  return true;
        if (vt == CAR   &amp;&amp; type == MEDIUM) return true;
        if (vt == TRUCK &amp;&amp; type == LARGE)  return true;
        return false;
    }

    void park(Vehicle* v) {
        parkedVehicle = v;
        status = OCCUPIED;
        cout &lt;&lt; "  Parked " &lt;&lt; v-&gt;licensePlate
             &lt;&lt; " at spot " &lt;&lt; spotId &lt;&lt; "\n";
    }

    void vacate() {
        cout &lt;&lt; "  Vacating spot " &lt;&lt; spotId &lt;&lt; "\n";
        parkedVehicle = nullptr;
        status = AVAILABLE;
    }
};

// ── Floor ─────────────────────────────────────────────
class Floor {
public:
    int floorNo;
    vector&lt;ParkingSpot*&gt; spots;

    Floor(int n) : floorNo(n) {
        // Each floor: 2 small, 3 medium, 1 large spot
        spots.push_back(new ParkingSpot(n*100+1, SMALL));
        spots.push_back(new ParkingSpot(n*100+2, SMALL));
        spots.push_back(new ParkingSpot(n*100+3, MEDIUM));
        spots.push_back(new ParkingSpot(n*100+4, MEDIUM));
        spots.push_back(new ParkingSpot(n*100+5, MEDIUM));
        spots.push_back(new ParkingSpot(n*100+6, LARGE));
    }

    ParkingSpot* findAvailableSpot(VehicleType vt) {
        for (auto spot : spots)
            if (spot-&gt;isAvailable() &amp;&amp; spot-&gt;canFit(vt))
                return spot;
        return nullptr;
    }

    int availableCount() {
        int cnt = 0;
        for (auto s : spots) if (s-&gt;isAvailable()) cnt++;
        return cnt;
    }
};

// ── Ticket ────────────────────────────────────────────
class Ticket {
public:
    int        ticketId;
    Vehicle* vehicle;
    ParkingSpot* spot;
    time_t     entryTime;

    Ticket(int id, Vehicle* v, ParkingSpot* s)
        : ticketId(id), vehicle(v), spot(s) {
        entryTime = time(nullptr);
    }

    double calculateFee(double ratePerHour = 50.0) {
        time_t now = time(nullptr);
        double hours = max(1.0, difftime(now, entryTime) / 3600.0);
        return hours * ratePerHour;
    }
};

// ── Parking Lot ───────────────────────────────────────
class ParkingLot {
    vector&lt;Floor*&gt; floors;
    int ticketCounter = 0;
public:
    ParkingLot(int numFloors) {
        for (int i = 1; i &lt;= numFloors; i++)
            floors.push_back(new Floor(i));
        cout &lt;&lt; "Parking lot ready with " &lt;&lt; numFloors &lt;&lt; " floors.\n";
    }

    Ticket* entry(Vehicle* v) {
        for (auto floor : floors) {
            ParkingSpot* spot = floor-&gt;findAvailableSpot(v-&gt;type);
            if (spot) {
                spot-&gt;park(v);
                Ticket* t = new Ticket(++ticketCounter, v, spot);
                cout &lt;&lt; "  Ticket #" &lt;&lt; t-&gt;ticketId &lt;&lt; " issued.\n";
                return t;
            }
        }
        cout &lt;&lt; "  No spot available for this vehicle.\n";
        return nullptr;
    }

    void exit(Ticket* t) {
        double fee = t-&gt;calculateFee();
        cout &lt;&lt; "  Fee for " &lt;&lt; t-&gt;vehicle-&gt;licensePlate
             &lt;&lt; ": Rs." &lt;&lt; fee &lt;&lt; "\n";
        t-&gt;spot-&gt;vacate();
        delete t;
    }

    void displayAvailability() {
        cout &lt;&lt; "\n--- Availability ---\n";
        for (auto f : floors)
            cout &lt;&lt; "Floor " &lt;&lt; f-&gt;floorNo
                 &lt;&lt; ": " &lt;&lt; f-&gt;availableCount() &lt;&lt; " spots free\n";
    }
};

// ── Main ──────────────────────────────────────────────
int main() {
    ParkingLot lot(2);
    lot.displayAvailability();

    Car   car1("MH-01-AB-1234");
    Bike  bike1("DL-05-CD-5678");
    Truck truck1("KA-09-EF-9012");

    cout &lt;&lt; "\n-- Entry --\n";
    Ticket* t1 = lot.entry(&amp;car1);
    Ticket* t2 = lot.entry(&amp;bike1);
    Ticket* t3 = lot.entry(&amp;truck1);

    lot.displayAvailability();

    cout &lt;&lt; "\n-- Exit --\n";
    if (t1) lot.exit(t1);
    lot.displayAvailability();

    return 0;
}</div>

                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. How would you extend this to support reserved spots and subscription users? <span class="arrow">▾</span></div><div class="qa-a">Add SpotType RESERVED to the enum. Add a User class with membership level (REGULAR, SUBSCRIBER). Modify ParkingLot.entry() to check if user is subscriber before assigning a reserved spot. Add PricingStrategy interface with implementations: StandardPricing, SubscriberPricing (discounted), HourlyPricing. Inject the strategy into Ticket.calculateFee() — this follows OCP (new pricing = new class, no modification to existing code) and DIP (Ticket depends on IPricingStrategy abstraction).</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. What design patterns are used in the Parking Lot design? <span class="arrow">▾</span></div><div class="qa-a">(1) Strategy pattern — canFit() per spot type can be extracted to a fitting strategy. (2) Factory pattern — creating the right Vehicle subtype (Car, Bike, Truck) based on input. (3) Singleton — ParkingLot itself is typically a singleton (one lot manages all floors). (4) Observer — when a spot is vacated, notify a WaitingQueue of waiting vehicles. (5) Template Method — calculateFee() has a skeleton; subclasses could override rate logic. In the interview, mention at least 2-3 patterns you consciously applied and why.</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q3. How would you handle concurrency — two cars trying to book the same spot? <span class="arrow">▾</span></div><div class="qa-a">In production (multithreaded system): use a mutex lock on findAvailableSpot() and the spot assignment as a critical section. In C++: std::mutex + std::lock_guard around the spot selection and marking. Better: use optimistic locking — try to mark spot as RESERVED atomically using compare-and-swap. If two threads both try to park at the same spot, only one succeeds (CAS returns success for one, failure for the other — the loser retries). In a distributed system: use Redis with SETNX (Set if Not eXists) to atomically reserve a spot ID. This is a common follow-up in senior interviews.</div></div>

                    <div class="sec">
                        <h2>Full C++ implementation</h2>
                        <div class="cb"><span class="cb-label">C++ — Library Management LLD</span>#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;map&gt;
#include &lt;ctime&gt;
using namespace std;

enum BookStatus { AVAILABLE, BORROWED, RESERVED };

// ── Author ────────────────────────────────────────────
struct Author {
    string name, country;
};

// ── Book (logical entity) ─────────────────────────────
class Book {
public:
    string isbn, title, genre;
    Author author;
    Book(string i, string t, string g, Author a)
        : isbn(i), title(t), genre(g), author(a) {}
};

// ── BookItem (physical copy) ──────────────────────────
class BookItem {
public:
    int    itemId;
    Book* book;
    BookStatus status;
    BookItem(int id, Book* b) : itemId(id), book(b), status(AVAILABLE) {}
    bool isAvailable() { return status == AVAILABLE; }
};

// ── Lending record ────────────────────────────────────
class Lending {
public:
    int    lendingId;
    BookItem* item;
    string  memberName;
    time_t  issueDate;
    int     dueDays;

    Lending(int id, BookItem* it, string m, int days = 14)
        : lendingId(id), item(it), memberName(m), dueDays(days) {
        issueDate = time(nullptr);
    }

    double calculateFine(double ratePerDay = 2.0) {
        time_t now = time(nullptr);
        double daysElapsed = difftime(now, issueDate) / 86400.0;
        double overdue = daysElapsed - dueDays;
        return (overdue &gt; 0) ? overdue * ratePerDay : 0.0;
    }
};

// ── Member ────────────────────────────────────────────
class Member {
public:
    int    memberId;
    string name, email;
    vector&lt;Lending*&gt; activeLendings;
    static const int MAX_BOOKS = 3;

    Member(int id, string n, string e)
        : memberId(id), name(n), email(e) {}

    bool canBorrow() {
        return (int)activeLendings.size() &lt; MAX_BOOKS;
    }
};

// ── Library ───────────────────────────────────────────
class Library {
    map&lt;string, Book*&gt;   catalog;     // isbn → Book
    vector&lt;BookItem*&gt;    inventory;
    vector&lt;Member*&gt;      members;
    int lendingCounter = 0;

public:
    void addBook(Book* b, int copies) {
        catalog[b-&gt;isbn] = b;
        for (int i = 0; i &lt; copies; i++)
            inventory.push_back(new BookItem((int)inventory.size()+1, b));
        cout &lt;&lt; "Added \"" &lt;&lt; b-&gt;title &lt;&lt; "\" (" &lt;&lt; copies &lt;&lt; " copies)\n";
    }

    void registerMember(Member* m) {
        members.push_back(m);
        cout &lt;&lt; "Member registered: " &lt;&lt; m-&gt;name &lt;&lt; "\n";
    }

    BookItem* findAvailableCopy(string isbn) {
        for (auto item : inventory)
            if (item-&gt;book-&gt;isbn == isbn &amp;&amp; item-&gt;isAvailable())
                return item;
        return nullptr;
    }

    Lending* borrowBook(Member* m, string isbn) {
        if (!m-&gt;canBorrow()) {
            cout &lt;&lt; m-&gt;name &lt;&lt; " has reached borrow limit.\n";
            return nullptr;
        }
        BookItem* item = findAvailableCopy(isbn);
        if (!item) {
            cout &lt;&lt; "No copy available for ISBN: " &lt;&lt; isbn &lt;&lt; "\n";
            return nullptr;
        }
        item-&gt;status = BORROWED;
        Lending* l = new Lending(++lendingCounter, item, m-&gt;name);
        m-&gt;activeLendings.push_back(l);
        cout &lt;&lt; m-&gt;name &lt;&lt; " borrowed \"" &lt;&lt; item-&gt;book-&gt;title
             &lt;&lt; "\" (Item #" &lt;&lt; item-&gt;itemId &lt;&lt; "). Due in 14 days.\n";
        return l;
    }

    void returnBook(Member* m, Lending* l) {
        double fine = l-&gt;calculateFine();
        l-&gt;item-&gt;status = AVAILABLE;
        if (fine &gt; 0)
            cout &lt;&lt; m-&gt;name &lt;&lt; " returned \"" &lt;&lt; l-&gt;item-&gt;book-&gt;title
                 &lt;&lt; "\". Fine: Rs." &lt;&lt; fine &lt;&lt; "\n";
        else
            cout &lt;&lt; m-&gt;name &lt;&lt; " returned \"" &lt;&lt; l-&gt;item-&gt;book-&gt;title
                 &lt;&lt; "\". No fine.\n";

        auto&amp; al = m-&gt;activeLendings;
        // Erase returned lending
        for(auto it = al.begin(); it != al.end(); ++it) {
            if(*it == l) {
                al.erase(it);
                break;
            }
        }
        delete l;
    }

    void searchByTitle(string title) {
        cout &lt;&lt; "\nSearch results for \"" &lt;&lt; title &lt;&lt; "\":\n";
        bool found = false;
        for (auto const&amp; pair : catalog) {
            Book* book = pair.second;
            if (book-&gt;title.find(title) != string::npos) {
                BookItem* copy = findAvailableCopy(book-&gt;isbn);
                cout &lt;&lt; "  " &lt;&lt; book-&gt;title &lt;&lt; " by " &lt;&lt; book-&gt;author.name
                     &lt;&lt; " — " &lt;&lt; (copy ? "Available" : "All borrowed") &lt;&lt; "\n";
                found = true;
            }
        }
        if (!found) cout &lt;&lt; "  Not found.\n";
    }
};

    Author a2{"Bjarne Stroustrup", "Denmark"};

                            <div class="card"><div class="lbl">IDLE</div><div class="val">Waiting</div><div class="sub">No money inserted, no item selected</div></div>
                            <div class="card"><div class="lbl">HAS_MONEY</div><div class="val">Money inserted</div><div class="sub">Waiting for item selection</div></div>
                            <div class="card"><div class="lbl">DISPENSING</div><div class="val">Dispensing</div><div class="sub">Item selected, dispensing in progress</div></div>
                            <div class="card"><div class="lbl">OUT_OF_STOCK</div><div class="val">Empty</div><div class="sub">Selected item not available</div></div>

                    <div class="sec">
                        <h2>C++ implementation with State pattern</h2>
                        <div class="cb"><span class="cb-label">C++ — Vending Machine (State pattern)</span>#include &lt;iostream&gt;
#include &lt;map&gt;
using namespace std;

// ── Product ───────────────────────────────────────────
struct Product {
    string name;
    double price;
    int    stock;
};

class VendingMachine;  // forward declaration

// ── State interface ───────────────────────────────────
class State {
public:
    virtual void insertMoney(VendingMachine* vm, double amount) = 0;
    virtual void selectItem (VendingMachine* vm, int code)      = 0;
    virtual void dispense   (VendingMachine* vm)                = 0;
    virtual void cancel     (VendingMachine* vm)                = 0;
    virtual ~State() {}
};

// ── Vending Machine ───────────────────────────────────
class VendingMachine {
public:
    State* currentState;
    double  insertedAmount;
    int     selectedCode;
    map&lt;int, Product&gt; products;   // code → Product

    VendingMachine();

    void insertMoney(double amount) { currentState-&gt;insertMoney(this, amount); }
    void selectItem (int code)      { currentState-&gt;selectItem (this, code);  }
    void dispense   ()              { currentState-&gt;dispense   (this);        }
    void cancel     ()              { currentState-&gt;cancel     (this);        }

    void setState(State* s)         { currentState = s; }
    void addProduct(int code, Product p) { products[code] = p; }
};

// ── Idle State ────────────────────────────────────────
class IdleState : public State {
public:
    void insertMoney(VendingMachine* vm, double amount) override;
    void selectItem (VendingMachine* vm, int code) override {
        cout &lt;&lt; "Please insert money first.\n";
    }
    void dispense(VendingMachine* vm) override {
        cout &lt;&lt; "No transaction in progress.\n";
    }
    void cancel(VendingMachine* vm) override {
        cout &lt;&lt; "Nothing to cancel.\n";
    }
};

// ── HasMoney State ────────────────────────────────────
class HasMoneyState : public State {
public:
    void insertMoney(VendingMachine* vm, double amount) override {
        vm-&gt;insertedAmount += amount;
        cout &lt;&lt; "Total inserted: Rs." &lt;&lt; vm-&gt;insertedAmount &lt;&lt; "\n";
    }
    void selectItem(VendingMachine* vm, int code) override;
    void dispense  (VendingMachine* vm) override {
        cout &lt;&lt; "Select an item first.\n";
    }
    void cancel(VendingMachine* vm) override;
};

// ── Dispensing State ──────────────────────────────────
class DispensingState : public State {
public:
    void insertMoney(VendingMachine* vm, double amount) override {
        cout &lt;&lt; "Dispensing in progress. Please wait.\n";
    }
    void selectItem(VendingMachine* vm, int code) override {
        cout &lt;&lt; "Already dispensing.\n";
    }
    void dispense(VendingMachine* vm) override;
    void cancel(VendingMachine* vm) override {
        cout &lt;&lt; "Cannot cancel during dispensing.\n";
    }
};

// ── Singleton states ──────────────────────────────────
IdleState       idleState;
HasMoneyState   hasMoneyState;
DispensingState dispensingState;

// ── VendingMachine constructor ────────────────────────
VendingMachine::VendingMachine()
    : currentState(&amp;idleState), insertedAmount(0), selectedCode(-1) {}

// ── State method bodies ───────────────────────────────
void IdleState::insertMoney(VendingMachine* vm, double amount) {
    vm-&gt;insertedAmount = amount;
    cout &lt;&lt; "Inserted Rs." &lt;&lt; amount &lt;&lt; "\n";
    vm-&gt;setState(&amp;hasMoneyState);
}

void HasMoneyState::selectItem(VendingMachine* vm, int code) {
    if (vm-&gt;products.find(code) == vm-&gt;products.end()) {
        cout &lt;&lt; "Invalid item code.\n"; return;
    }
    Product&amp; p = vm-&gt;products[code];
    if (p.stock == 0) {
        cout &lt;&lt; p.name &lt;&lt; " is out of stock. Returning money.\n";
        vm-&gt;insertedAmount = 0;
        vm-&gt;setState(&amp;idleState);
        return;
    }
    if (vm-&gt;insertedAmount &lt; p.price) {
        cout &lt;&lt; "Insufficient. Need Rs." &lt;&lt; (p.price - vm-&gt;insertedAmount) &lt;&lt; " more.\n";
        return;
    }
    vm-&gt;selectedCode = code;
    vm-&gt;setState(&amp;dispensingState);
    vm-&gt;dispense();
}

void HasMoneyState::cancel(VendingMachine* vm) {
    cout &lt;&lt; "Returning Rs." &lt;&lt; vm-&gt;insertedAmount &lt;&lt; "\n";
    vm-&gt;insertedAmount = 0;
    vm-&gt;setState(&amp;idleState);
}

void DispensingState::dispense(VendingMachine* vm) {
    Product&amp; p = vm-&gt;products[vm-&gt;selectedCode];
    double change = vm-&gt;insertedAmount - p.price;
    cout &lt;&lt; "Dispensing: " &lt;&lt; p.name &lt;&lt; "\n";
    if (change &gt; 0) cout &lt;&lt; "Change returned: Rs." &lt;&lt; change &lt;&lt; "\n";
    p.stock--;
    vm-&gt;insertedAmount = 0;
    vm-&gt;selectedCode   = -1;
    vm-&gt;setState(&amp;idleState);
}

// ── Main ──────────────────────────────────────────────
int main() {
    VendingMachine vm;
    vm.addProduct(1, {"Pepsi",    30.0, 3});
    vm.addProduct(2, {"Lay's",    20.0, 2});
    vm.addProduct(3, {"KitKat",   15.0, 1});

    cout &lt;&lt; "=== Transaction 1: Normal purchase ===\n";
    vm.insertMoney(50);
    vm.selectItem(1);

    cout &lt;&lt; "\n=== Transaction 2: Insufficient money ===\n";
    vm.insertMoney(10);
    vm.selectItem(1);    // Pepsi costs 30
    vm.insertMoney(25);  // add more
    vm.selectItem(1);

    cout &lt;&lt; "\n=== Transaction 3: Cancel ===\n";
    vm.insertMoney(40);
    vm.cancel();

    cout &lt;&lt; "\n=== Transaction 4: Select without inserting ===\n";
    vm.selectItem(2);

    return 0;
}</div>

Dispensing: Pepsi
Change returned: Rs.20

Total inserted: Rs.35
Dispensing: Pepsi
Change returned: Rs.5

=== Transaction 4: Select without inserting ===
Please insert money first.</div>

                    <div class="sec">
                        <h2>Interview Q&A</h2>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. What design pattern is this and why is it the right choice? <span class="arrow">▾</span></div><div class="qa-a">State pattern (Behavioural). Without it, every method (insertMoney, selectItem, dispense) would have a giant if-else chain checking the current state — unmaintainable as states grow. State pattern encapsulates each state's behaviour in its own class. Adding a new state (e.g., MAINTENANCE) means adding a new class — no modification to existing states. The VendingMachine delegates all actions to the current State object. This follows OCP perfectly.</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. What other design patterns are used here? <span class="arrow">▾</span></div><div class="qa-a">Singleton: the state objects (idleState, hasMoneyState, dispensingState) are singletons — only one instance of each state ever exists since states are stateless themselves (state data lives in VendingMachine, not in State objects). Context pattern: VendingMachine acts as the context that delegates to states. Strategy: different pricing or dispensing strategies could be injected. This is a great example to show multiple patterns working together — mention this in the interview to stand out.</div></div>
                    </div>
                `

                id: 't7', label: 'LLD: ATM Machine', html: `
                    <div class="sec">
                        <h2>Problem statement</h2>
                        <p>Design an ATM system. Support card insertion, PIN verification, balance check, cash withdrawal, and receipt generation. Handle errors gracefully.</p>
                    </div>
                    <div class="sec">
                        <h2>ATM states</h2>
                        <div class="card-row">
                            <div class="card"><div class="lbl">IDLE</div><div class="val">No card inserted</div><div class="sub">Waiting for card</div></div>
                            <div class="card"><div class="lbl">CARD_INSERTED</div><div class="val">Authenticating</div><div class="sub">PIN entry in progress</div></div>
                            <div class="card"><div class="lbl">AUTHENTICATED</div><div class="val">Logged in</div><div class="sub">Balance/withdrawal menu</div></div>
                            <div class="card"><div class="lbl">DISPENSING</div><div class="val">Counting cash</div><div class="sub">Dispensing in progress</div></div>
                        </div>
                    </div>
                    <div class="sec">
                        <h2>C++ implementation</h2>
                        <div class="cb"><span class="cb-label">C++ — ATM Machine LLD</span>#include &lt;iostream&gt;
#include &lt;map&gt;
#include &lt;cmath&gt;
using namespace std;

// ── Bank Account ──────────────────────────────────────
class BankAccount {
public:
    string accountNumber;
    double balance;
    BankAccount(string acc, double bal) : accountNumber(acc), balance(bal) {}

    bool deduct(double amount) {
        if (amount &gt; balance) return false;
        balance -= amount;
        return true;
    }
};

// ── Card ──────────────────────────────────────────────
class Card {
public:
    string cardNumber;
    string pin;
    BankAccount* account;
    Card(string cn, string p, BankAccount* acc)
        : cardNumber(cn), pin(p), account(acc) {}

    bool validatePin(string enteredPin) { return pin == enteredPin; }
};

// ── Cash Dispenser ────────────────────────────────────
class CashDispenser {
    double totalCash;
public:
    CashDispenser(double cash) : totalCash(cash) {}

    bool dispenseCash(double amount) {
        if (amount &gt; totalCash || fmod(amount, 100) != 0) {
            cout &lt;&lt; "  [Dispenser] Cannot dispense Rs." &lt;&lt; amount &lt;&lt; "\n";
            return false;
        }
        totalCash -= amount;
        cout &lt;&lt; "  [Dispenser] Dispensing Rs." &lt;&lt; amount &lt;&lt; "\n";
        cout &lt;&lt; "  [Dispenser] Remaining in ATM: Rs." &lt;&lt; totalCash &lt;&lt; "\n";
        return true;
    }
};

// ── Receipt Printer ───────────────────────────────────
class ReceiptPrinter {
public:
    void print(string accNo, string txnType, double amount, double balance) {
        cout &lt;&lt; "\n  --- RECEIPT ---\n";
        cout &lt;&lt; "  Account : " &lt;&lt; accNo    &lt;&lt; "\n";
        cout &lt;&lt; "  Txn     : " &lt;&lt; txnType  &lt;&lt; "\n";
        cout &lt;&lt; "  Amount  : Rs." &lt;&lt; amount &lt;&lt; "\n";
        cout &lt;&lt; "  Balance : Rs." &lt;&lt; balance &lt;&lt; "\n";
        cout &lt;&lt; "  ---------------\n";
    }
};

// ── ATM ───────────────────────────────────────────────
enum ATMState { IDLE, CARD_INSERTED, AUTHENTICATED, DISPENSING };

class ATM {
    ATMState       state;
    Card* currentCard;
    int            pinAttempts;
    CashDispenser  dispenser;
    ReceiptPrinter printer;

public:
    ATM(double cash) : state(IDLE), currentCard(nullptr),
                       pinAttempts(0), dispenser(cash) {}

    void insertCard(Card* card) {
        if (state != IDLE) {
            cout &lt;&lt; "ATM busy. Please wait.\n"; return;
        }
        currentCard = card;
        state = CARD_INSERTED;
        pinAttempts = 0;
        cout &lt;&lt; "Card inserted. Please enter PIN.\n";
    }

    void enterPin(string pin) {
        if (state != CARD_INSERTED) {
            cout &lt;&lt; "Please insert card first.\n"; return;
        }
        if (currentCard-&gt;validatePin(pin)) {
            state = AUTHENTICATED;
            pinAttempts = 0;
            cout &lt;&lt; "PIN correct. Welcome!\n";
            cout &lt;&lt; "Balance: Rs." &lt;&lt; currentCard-&gt;account-&gt;balance &lt;&lt; "\n";
        } else {
            pinAttempts++;
            cout &lt;&lt; "Wrong PIN. Attempt " &lt;&lt; pinAttempts &lt;&lt; "/3\n";
            if (pinAttempts &gt;= 3) {
                cout &lt;&lt; "Card blocked after 3 failed attempts. Card ejected.\n";
                ejectCard();
            }
        }
    }

    void checkBalance() {
        if (state != AUTHENTICATED) {
            cout &lt;&lt; "Please authenticate first.\n"; return;
        }
        cout &lt;&lt; "Current balance: Rs."
             &lt;&lt; currentCard-&gt;account-&gt;balance &lt;&lt; "\n";
    }

    void withdraw(double amount) {
        if (state != AUTHENTICATED) {
            cout &lt;&lt; "Please authenticate first.\n"; return;
        }
        state = DISPENSING;
        if (!currentCard-&gt;account-&gt;deduct(amount)) {
            cout &lt;&lt; "Insufficient balance.\n";
            state = AUTHENTICATED;
            return;
        }
        if (!dispenser.dispenseCash(amount)) {
            currentCard-&gt;account-&gt;balance += amount; // rollback
            state = AUTHENTICATED;
            return;
        }
        printer.print(currentCard-&gt;account-&gt;accountNumber,
                      "WITHDRAWAL", amount,
                      currentCard-&gt;account-&gt;balance);
        state = AUTHENTICATED;
    }

    void ejectCard() {
        cout &lt;&lt; "Card ejected. Goodbye.\n";
        currentCard = nullptr;
        state = IDLE;
    }
};

// ── Main ──────────────────────────────────────────────
int main() {
    BankAccount acc1("ACC1001", 25000);
    BankAccount acc2("ACC1002", 5000);
    Card card1("4111111111111111", "1234", &amp;acc1);
    Card card2("4222222222222222", "9999", &amp;acc2);

    ATM atm(100000);

    cout &lt;&lt; "=== Session 1: Normal withdrawal ===\n";
    atm.insertCard(&amp;card1);
    atm.enterPin("0000");    // wrong
    atm.enterPin("1234");    // correct
    atm.checkBalance();
    atm.withdraw(5000);
    atm.withdraw(500);       // not multiple of 100? still valid
    atm.ejectCard();

    cout &lt;&lt; "\n=== Session 2: Block on 3 wrong PINs ===\n";
    atm.insertCard(&amp;card2);
    atm.enterPin("0000");
    atm.enterPin("1111");
    atm.enterPin("2222");    // 3rd wrong — card blocked

    return 0;
}</div>

                        <h2>Interview Q&A</h2>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q1. How would you make the ATM thread-safe for concurrent transactions? <span class="arrow">▾</span></div><div class="qa-a">Key critical sections: (1) Account balance read-modify-write in withdraw() — two threads simultaneously withdrawing from the same account could both pass the balance check then both deduct, overdrawing the account. Fix: use a mutex per account, or use std::atomic for balance with compare-exchange. (2) ATM state transitions — wrap state changes in a mutex to prevent two sessions from both entering AUTHENTICATED simultaneously. In practice, ATMs are single-session machines (hardware enforced), but the BankAccount accessed via a central server must use database-level locking with SELECT FOR UPDATE.</div></div>
                        <div class="qa"><div class="qa-q" onclick="tog(this)">Q2. How would you apply the State pattern to this ATM more cleanly? <span class="arrow">▾</span></div><div class="qa-a">Extract each ATMState into its own class: IdleState, CardInsertedState, AuthenticatedState, DispensingState — each implementing an IATMState interface with methods: insertCard(), enterPin(), withdraw(), ejectCard(). The ATM class holds a pointer to the current IATMState and delegates all calls to it. Benefits: (1) Adding a new state (e.g., BLOCKED) = add a new class with no changes to existing states. (2) Each state's logic is isolated — easier to test. (3) Invalid operations per state (like calling withdraw() in IdleState) are handled by each state's implementation, not by if-else chains in ATM.</div></div>
