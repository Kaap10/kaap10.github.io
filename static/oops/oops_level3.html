                        <h2>The 5 Principles</h2>

                            <div class="step-header"><div class="step-num">S</div><div class="step-title">Single Responsibility Principle (SRP)</div></div>
                            <div class="step-body">A class should have one, and only one, reason to change. Example: A <code>User</code> class should hold user data, but saving the user to a database should be handled by a <code>UserRepository</code> class.</div>

                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

// Abstract Base Class (The Abstraction)
class Shape {
public:
    virtual double calculateArea() = 0;
};

// Extension 1 (No modification to Shape required)
class Circle : public Shape {
    double radius;
public:
    Circle(double r) : radius(r) {}
    double calculateArea() override { return 3.14 * radius * radius; }
};

// Extension 2 (No modification to Shape required)
class Square : public Shape {

public:

};

void printArea(Shape* shape) {

                    <div class="section">
                        <h2>What is it? (Creational)</h2>
                        <p>The Singleton pattern ensures that a class has <strong>only one instance</strong> globally, and provides a global point of access to it.</p>

                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

class DatabaseManager {
private:
    // 1. Private Constructor
    DatabaseManager() { cout &lt;&lt; "Database connected!" &lt;&lt; endl; }

public:
    // 2. Delete copy constructor and assignment operator
    DatabaseManager(const DatabaseManager&) = delete;
    void operator=(const DatabaseManager&) = delete;

    // 3. Static access method (Thread-safe in C++11 and later)
    static DatabaseManager& getInstance() {
        static DatabaseManager instance; // Created only once
        return instance;
    }
};

int main() {
    DatabaseManager& db1 = DatabaseManager::getInstance(); 
    DatabaseManager& db2 = DatabaseManager::getInstance(); 
    
    cout &lt;&lt; "Address of db1: " &lt;&lt; &db1 &lt;&lt; endl;
    cout &lt;&lt; "Address of db2: " &lt;&lt; &db2 &lt;&lt; endl;

}

                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

// Product Interface
class Vehicle {
public:
    virtual void create() = 0;
    virtual ~Vehicle() {}
};

// Concrete Products
class Car : public Vehicle {
public:
    void create() override { cout &lt;&lt; "Car manufactured." &lt;&lt; endl; }
};

class Bike : public Vehicle {
public:
    void create() override { cout &lt;&lt; "Bike manufactured." &lt;&lt; endl; }
};

class VehicleFactory {
public:

        if (type == "Bike") return new Bike();
        return nullptr;
    }

    }

}

#include &lt;vector&gt;
using namespace std;

// Observer Interface
class Subscriber {
public:
    virtual void update(string videoTitle) = 0;
};

// Concrete Observer
class User : public Subscriber {
    string name;
public:

class YouTubeChannel {

class PaymentStrategy {

                    <div class="section">
                        <h2>How Runtime Polymorphism actually works</h2>
                        <p>When you declare a function as <code>virtual</code> in C++, the compiler performs "Late Binding" (Dynamic Dispatch). It achieves this silently under the hood using a <strong>vtable</strong> (Virtual Table) and a <strong>vptr</strong> (Virtual Pointer).</p>
                        
                    </div>
                    <div class="section">
                        <h2>The Internals</h2>
                        <div class="step">
                            <div class="step-header"><div class="step-num">1</div><div class="step-title">vtable (Virtual Table)</div></div>
                            <div class="step-body">The compiler creates a static array (table) of function pointers for <strong>every class</strong> that contains at least one virtual function. It stores the memory addresses of the virtual functions.</div>
                        </div>
                        <div class="step">
                            <div class="step-header"><div class="step-num">2</div><div class="step-title">vptr (Virtual Pointer)</div></div>
                            <div class="step-body">The compiler secretly adds a hidden pointer (<code>vptr</code>) to <strong>every object</strong> of that class. This pointer points to the vtable of that specific class.</div>
                        </div>
                    </div>
                    <div class="section">
                        <h2>C++ Code: Proving the hidden vptr</h2>
                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

// Normal Class
class NormalClass {
    void display() { cout &lt;&lt; "Hello"; } 
};

// Polymorphic Class
class VirtualClass {
    virtual void display() { cout &lt;&lt; "Hello"; }
};

int main() {
    NormalClass n;
    VirtualClass v;

    cout &lt;&lt; "Size of NormalClass object: " &lt;&lt; sizeof(n) &lt;&lt; " byte" &lt;&lt; endl;
    cout &lt;&lt; "Size of VirtualClass object: " &lt;&lt; sizeof(v) &lt;&lt; " bytes" &lt;&lt; endl;
    
    return 0;
}

/* Output (on 64-bit architecture):
Size of NormalClass object: 1 byte
Size of VirtualClass object: 8 bytes
*/</div>

                html: `
                    <div class="section">
                        <h2>What is the Diamond Problem?</h2>
                        <p>It occurs in <strong>Multiple Inheritance</strong> when a class (D) inherits from two classes (B and C), both of which inherit from the same root base class (A). </p>
                        <p>This forms a diamond shape: A &rarr; B, A &rarr; C, {B, C} &rarr; D. If class D calls a method from A, the compiler gets confused: should it access A through the B path, or the C path?</p>
                        
                    </div>
                    <div class="section">
                        <h2>The C++ Solution: Virtual Inheritance</h2>
                        <p>By inheriting the base class <code>virtually</code>, C++ ensures that only <strong>one single shared instance</strong> of the root base class (A) is inherited by the grandchild class (D).</p>
                    </div>
                    <div class="section">
                        <h2>C++ Code: Resolving the Diamond</h2>
                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

class Animal {
public:
    int age;
    Animal() { cout &lt;&lt; "Animal Created." &lt;&lt; endl; }
};

// Use 'virtual' keyword to prevent duplication
class Tiger : virtual public Animal {}; 
class Lion : virtual public Animal {}; 

// Liger inherits from both Tiger and Lion
class Liger : public Tiger, public Lion {
public:
    void setAge(int a) {
        // Without 'virtual' above, this would throw an "ambiguous" error!
        age = a; 
    }
};

int main() {
    Liger napoleon;
    napoleon.setAge(5);
    cout &lt;&lt; "Liger age is: " &lt;&lt; napoleon.age &lt;&lt; endl;
    return 0;
}

/* Output:
Animal Created.   &lt;-- Notice this prints ONLY ONCE!
Liger age is: 5
*/</div>
                    </div>

                        <h2>Interview Q&A</h2>

                            <div class="qa-a">Java simply <strong>bans multiple inheritance</strong> with classes. You cannot do <code>class C extends A, B</code>. You can only implement multiple interfaces. Since interfaces have no state (no data members) and conventionally no implementation, there is no ambiguity about whose variable or logic to inherit.</div>
                        </div>
                    </div>

                    <div class="section">
                        <h2>The Default Copy Constructor (Shallow Copy)</h2>
                        <p>When you copy an object (<code>Obj A = B;</code>), C++ provides a default copy constructor. It copies all member values as-is. If a member is a pointer, it copies the <strong>memory address</strong>, not the actual data. Now both objects point to the same memory. If one object deletes the memory, the other object crashes (Dangling Pointer / Double Free Error).</p>
                    </div>
                    <div class="section">
                        <h2>Deep Copy (The Solution)</h2>
                        <p>You must write a <strong>Custom Copy Constructor</strong>. Instead of copying the memory address, you allocate <strong>brand new memory</strong> for the new object and copy the actual values over.</p>
                        
                    </div>
                    <div class="section">
                        <h2>C++ Code: Implementing Deep Copy</h2>
                        <div class="code-block">#include &lt;iostream&gt;
using namespace std;

class DeepCopyClass {
public:
    int* data;

    // Constructor
    DeepCopyClass(int val) {
        data = new int(val);
    }

    // CUSTOM DEEP COPY CONSTRUCTOR
    DeepCopyClass(const DeepCopyClass& source) {
        // Allocate NEW memory block
        data = new int;
        // Copy the VALUE, not the pointer address
        *data = *(source.data);
    }

    ~DeepCopyClass() { delete data; }
};

int main() {
    DeepCopyClass obj1(100);
    DeepCopyClass obj2 = obj1; // Calls our Deep Copy Constructor

    cout &lt;&lt; "Obj1 data address: " &lt;&lt; obj1.data &lt;&lt; endl;
    cout &lt;&lt; "Obj2 data address: " &lt;&lt; obj2.data &lt;&lt; endl;
    
    // Changing obj1 does NOT affect obj2 because memory is separate!
    *(obj1.data) = 500;
    cout &lt;&lt; "Obj2 value is still: " &lt;&lt; *(obj2.data) &lt;&lt; endl;

    return 0;
}

/* Output:
Obj1 data address: 0x55e0c8b32eb0
Obj2 data address: 0x55e0c8b32ed0  &lt;-- Different Memory Addresses!
Obj2 value is still: 100
*/</div>
                    </div>

                            <div class="qa-a">Object slicing happens when a Derived class object is assigned to a Base class <strong>value</strong> (not pointer or reference). The compiler "slices off" all the extra attributes and methods that belong to the Derived class, keeping only the Base class part. To avoid this, always use pointers or references (<code>Base* ptr = &derivedObj;</code>).</div>

                        <div class="qa">

                            <div class="qa-a">1. <strong>Implementation:</strong> Abstract classes can contain actual logic (normal functions) alongside pure virtual functions. Interfaces contain ONLY pure virtual functions. <br>2. <strong>State:</strong> Abstract classes can have data variables. Interfaces cannot have variables. <br>3. <strong>Inheritance:</strong> A class can inherit only one Abstract Class, but can implement multiple Interfaces.</div>
